name: ADE Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Behavioral validation
        run: npm test

      - name: Canonical runtime validation
        run: npm run validate

      - name: Release verification
        run: npm run verify:release

      - name: Community build
        run: npm run build:community
