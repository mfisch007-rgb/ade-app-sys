name: ADE-APEX Enterprise Verification CI/CD

on:
  push:
    branches: [ "enterprise-modernization-v1", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Execute Runtime Verification Engine
        run: node run-runtime-verification.js
