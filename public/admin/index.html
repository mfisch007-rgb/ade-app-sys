<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADE Control Plane</title><style>
body{font-family:system-ui;margin:0;background:#07111f;color:#eef5ff}header{padding:18px 24px;border-bottom:1px solid #20324a;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(10px)}h1{margin:0;font-size:22px}.sub{color:#8fa4bd;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(12px,2.5vw,16px);padding:clamp(14px,3vw,24px);max-width:1440px;margin:0 auto;width:100%}.card{background:#0c1a2b;border:1px solid #20324a;border-radius:14px;padding:16px;overflow-x:auto;max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}.tab,button{background:#12243a;border:1px solid #2a4663;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tab.active{background:#17436a}.pill{padding:4px 8px;border-radius:99px;background:#173a2c;color:#86efac;font-size:12px}.muted{color:#8fa4bd}.hidden{display:none}input,select,textarea{width:100%;box-sizing:border-box;background:#07111f;color:#fff;border:1px solid #2a4663;border-radius:8px;padding:9px;margin:5px 0 10px}label{font-size:12px;color:#9fb2c9}table{width:100%;border-collapse:collapse;max-width:100%}td,th{padding:8px;border-bottom:1px solid #20324a;text-align:left;font-size:13px;white-space:nowrap}.wide{grid-column:1/-1}.ok{color:#86efac}.warn{color:#facc15}.danger{color:#f87171}pre{white-space:pre-wrap;max-height:400px;overflow:auto;background:#050b13;padding:12px;border-radius:8px}
</style></head><body><header><div class="row"><div><h1>ADE Command & Control Plane</h1><div class="sub">What-you-see-is-what-you-configure • runtime administration without source-code editing</div></div><div id="authbar" class="hidden" style="margin-left:auto"><span class="muted" id="authinfo"></span><button onclick="logout()">Logout</button></div></div></header><div class="tabs" id="tabs"><button class="tab active" onclick="show('overview',this)">Overview</button><button class="tab" onclick="show('intake',this)">Intake / Cases</button><button class="tab" onclick="show('connections',this)">Connections</button><button class="tab" onclick="show('channels',this)">Channels</button><button class="tab" onclick="show('partners',this)">Partners</button><button class="tab" onclick="show('settings',this)">Settings</button><button class="tab" onclick="show('capabilities',this)">Capabilities</button><button class="tab" onclick="show('workforce',this)">Workforce</button><button class="tab" onclick="show('announcements',this)">Announcements</button><button class="tab" onclick="show('audit',this)">Audit</button></div>
<main id="app" class="grid"></main>
<script>
const A='/api/v1'; let data={};
// Canonical authentication: the token issued by POST /api/v1/auth/pin is held
// in-session and attached to every protected request. Nothing is hardcoded.
let authState={token:sessionStorage.getItem('ade_admin_token')||null};
function setAuthUI(){const authed=!!authState.token;document.getElementById('authbar').classList.toggle('hidden',!authed);document.getElementById('tabs').classList.toggle('hidden',!authed);document.getElementById('authinfo').textContent=authed?'Authenticated session (canonical /api/v1/auth)':'';}
async function api(path,opt){const headers={'Content-Type':'application/json'};if(authState.token)headers['Authorization']='Bearer '+authState.token;const r=await fetch(A+path,{...opt,headers:Object.assign({},headers,(opt&&opt.headers)||{})});
 if(r.status===401||r.status===403){authState.token=null;sessionStorage.removeItem('ade_admin_token');setAuthUI();renderLogin(r.status===403?'Authorization expired — re-authenticate.':'Session required for this operation.','AUTH_REQUIRED');return{success:false,error:'UNAUTHORIZED'};}
 if(r.status===503){authState.token=null;sessionStorage.removeItem('ade_admin_token');setAuthUI();renderLogin('Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).','AUTH_NOT_CONFIGURED');return{success:false,error:'AUTH_NOT_CONFIGURED'};}
 return r.json();}
function loginCard(msg){return `<h3>Administrator authentication</h3><p class="muted">This control plane requires an authenticated level-2 session via the canonical <code>/api/v1/auth/pin</code> flow.</p><label>Admin PIN</label><input id="loginPin" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter')loginSubmit()"><button onclick="loginSubmit()">Authenticate</button><p id="authMsg" class="warn">${msg||''}</p>`;}
function renderLogin(msg,code){data={};document.getElementById('app').innerHTML='<section class="card wide">'+loginCard(msg)+'</section>';const pin=document.getElementById('loginPin');if(pin&&code==='AUTH_REQUIRED')pin.focus();}
async function loginSubmit(){const pin=(document.getElementById('loginPin')||{}).value;if(!pin)return;const r=await fetch(A+'/auth/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const body=await r.json();
 if(body.success&&body.token){authState.token=body.token;sessionStorage.setItem('ade_admin_token',body.token);setAuthUI();document.getElementById('authMsg')&&(document.getElementById('authMsg').textContent='');load();}
 else{document.getElementById('authMsg')&&(document.getElementById('authMsg').textContent=(body.error==='AUTH_NOT_CONFIGURED')?'Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).':(body.error==='INVALID_CREDENTIALS')?'Invalid PIN — check credentials and retry.':'Authentication failed ('+(body.error||r.status)+').');}}
async function logout(){const t=authState.token;authState.token=null;sessionStorage.removeItem('ade_admin_token');data={};setAuthUI();renderLogin('Signed out.','AUTH_REQUIRED');if(t){try{await fetch(A+'/auth/revoke',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});}catch{} }}
async function load(){if(!authState.token){setAuthUI();renderLogin();return;}data=await api('/admin/overview');if(data&&!data.success&&data.error==='UNAUTHORIZED')return;renderOverview();}
function card(t,b,wide=false){return `<section class="card ${wide?'wide':''}"><h3>${t}</h3>${b}</section>`}
function renderOverview(){document.getElementById('app').innerHTML=[card('Runtime',`<div class="ok">● Control plane online</div><p class="muted">Cases: ${(data.cases||[]).length} • Connections: ${(data.connections||[]).length} • Partners: ${(data.partners||[]).length}</p>`),card('Inbound channels',(data.channels||[]).map(c=>`<div class="row"><b>${c.label}</b><span class="pill">${c.enabled?'ENABLED':'DISABLED'}</span><span class="muted">${c.configured?'configured':'configuration pending'}</span></div>`).join('')),card('Autonomous operating loop',`<p>Demand → Intake → Entity → Case → Discovery → Assessment → Decision → Partner/Agent → Execution → Verification → Outcome</p><div class="ok">Unified case model is active.</div>`),card('Live event stream',`<div id="sse">Connecting…</div>`,true)].join('');
 const es=new EventSource('/api/v1/events/stream'); es.onopen=()=>document.getElementById('sse').innerHTML='<span class="ok">● SSE CONNECTED</span>'; es.onmessage=e=>document.getElementById('sse').textContent=e.data; es.onerror=()=>document.getElementById('sse').innerHTML='<span class="warn">SSE reconnecting…</span>';
}
async function renderIntake(){if(!authState.token){renderLogin();return;}const j=await api('/cases');document.getElementById('app').innerHTML=card('Create business opportunity',`<label>Channel</label><select id="ch">${(data.channels||[]).map(c=>`<option>${c.id}</option>`).join('')}</select><label>Company</label><input id="co" placeholder="ABC Manufacturing Ltd"><label>Contact email</label><input id="em" placeholder="ops@example.com"><label>Business request</label><textarea id="tx" rows="5" placeholder="We use Odoo and need procurement, inventory and production workflows integrated."></textarea><label><input id="pa" type="checkbox" style="width:auto"> Authorize public business analysis</label><button onclick="createCase()">Create & Evaluate</button>`,true)+card('Cases',(j.cases||[]).map(c=>`<div class="card"><b>${c.id}</b> <span class="pill">${c.status}</span><p>${c.organization||'Unknown organization'} — ${c.request.intent}</p><small class="muted">${c.channel} • confidence ${(c.confidence*100).toFixed(0)}% • next: ${c.nextAction}</small></div>`).join('')||'<span class="muted">No cases yet.</span>',true)}
async function createCase(){const r=await api('/intake/'+document.getElementById('ch').value,{method:'POST',body:JSON.stringify({company:document.getElementById('co').value,email:document.getElementById('em').value,text:document.getElementById('tx').value,authorization:{publicAnalysis:document.getElementById('pa').checked}})}); alert(r.success?'Case '+r.case.id+' created':'Error: '+r.error); renderIntake()}
async function renderConnections(){if(!authState.token){renderLogin();return;}const j=await api('/admin/connections');document.getElementById('app').innerHTML=card('Add connection',`<label>Provider</label><input id="p" placeholder="Odoo / SAP / Google / SMTP / Telegram"><label>Connection type</label><select id="t"><option>REST_API</option><option>WEBHOOK</option><option>SMTP</option><option>IMAP</option><option>OAUTH2</option></select><label>Base URL</label><input id="u" placeholder="https://example.com/api"><label>Authentication</label><select id="a"><option>API_KEY</option><option>OAUTH2</option><option>BEARER</option><option>BASIC</option><option>NONE</option></select><label>Secret / token (never displayed again)</label><input id="s" type="password"><button onclick="addConn()">Save Connection</button>`,false)+card('Configured connections',(j.connections||[]).map(c=>`<div class="row"><b>${c.provider}</b><span class="pill">${c.status}</span><span class="muted">${c.baseUrl||'no URL'}</span><button onclick="testConn('${c.id}')">Test</button></div>`).join('')||'<span class="muted">None</span>',true)}
async function addConn(){const r=await api('/admin/connections',{method:'POST',body:JSON.stringify({provider:p.value,type:t.value,baseUrl:u.value,authType:a.value,secret:s.value})});alert(r.success?'Saved':'Error: '+r.error);renderConnections()} async function testConn(id){alert(JSON.stringify(await api('/admin/connections/'+id+'/test'),null,2))}
async function renderChannels(){if(!authState.token){renderLogin();return;}const j=await api('/admin/channels');document.getElementById('app').innerHTML=card('Inbound channel fabric',(j.channels||[]).map(c=>`<div class="row" style="margin:8px 0"><b>${c.label}</b><span class="pill">${c.enabled?'ON':'OFF'}</span><button onclick="toggleCh('${c.id}',${!c.enabled})">${c.enabled?'Disable':'Enable'}</button></div>`).join(''),true)} async function toggleCh(id,enabled){await api('/admin/channels/'+id,{method:'PATCH',body:JSON.stringify({enabled})});renderChannels()}
async function renderPartners(){if(!authState.token){renderLogin();return;}const j=await api('/admin/partners');document.getElementById('app').innerHTML=card('Partner registry',`<label>Partner</label><input id="pn" placeholder="A2MPro"><label>Capabilities (comma separated)</label><input id="pc" placeholder="ERP integration, API integration, workflow automation, data migration"><button onclick="addPartner()">Register / Update Partner</button>`,false)+card('Registered partners',(j.partners||[]).map(p=>`<div><b>${p.name}</b> <span class="pill">${p.status}</span><p class="muted">${(p.capabilities||[]).join(' • ')}</p></div>`).join('')||'<span class="muted">None</span>',true)} async function addPartner(){await api('/admin/partners',{method:'POST',body:JSON.stringify({name:pn.value,capabilities:pc.value.split(',').map(x=>x.trim()).filter(Boolean),status:'EVALUATION'})});renderPartners()}
async function renderSettings(){if(!authState.token){renderLogin();return;}const j=await api('/admin/settings');document.getElementById('app').innerHTML=card('Runtime policy & UI settings',`<label>Community partner mode</label><select id="pm"><option value="high-access">High-access bounded partner evaluation</option><option value="standard">Standard Community</option></select><label>Demo mode</label><select id="dm"><option value="true">Enabled</option><option value="false">Disabled</option></select><label>Human approval threshold</label><select id="ha"><option>CONSEQUENTIAL_ACTIONS_ONLY</option><option>ALL_EXTERNAL_WRITES</option></select><button onclick="saveSettings()">Save settings</button><pre>${JSON.stringify(j.settings,null,2)}</pre>`,true)} async function saveSettings(){await api('/admin/settings',{method:'PATCH',body:JSON.stringify({policies:{partnerMode:pm.value,demoMode:dm.value==='true',humanApproval:ha.value}})});renderSettings()}
async function renderCapabilities(){if(!authState.token){renderLogin();return;}const j=await api('/capabilities');document.getElementById('app').innerHTML=card('Self-discovering capability fabric',`<p class="muted">${(j.capabilities||[]).length} authoritative capabilities exposed to the UI.</p><table><tr><th>Capability</th><th>RBAC</th><th>Tier</th><th>Runtime</th></tr>${(j.capabilities||[]).map(c=>`<tr><td>${c.name}</td><td>${c.rbacLevel}</td><td>${c.tier}</td><td class="ok">${c.runtimeBound?'YES':'NO'}</td></tr>`).join('')}</table>`,true)}
async function renderWorkforce(){if(!authState.token){renderLogin();return;}
 const j=await api('/workforce');const persons=j.persons||[];const agents=j.agents||[];const stats=j.stats||{};let html='';
 if(!persons.length||!stats.founderProvisioned){html+=card('Provision founder (first-run only)',`<p class="muted">No workforce account exists yet. The founder credential is the only bootstrap account. After provisioning, invite or provision other workforce members here.</p><label>Username</label><input id="fU" placeholder="founder"><label>Full name</label><input id="fN" placeholder="Ade Foundation"><label>Password (8+ chars)</label><input id="fP" type="password"><label>PIN (6 digits)</label><input id="fPin" type="password"><button onclick="provisionFounder()">Provision founder account</button>`,true);}
 html+=card('Workforce ('+(stats.total||persons.length)+' people)',`<label>Invite a person</label><div class="row"><span class="muted">full name</span><input id="ivN" placeholder="Jane Operator"><span class="muted">role</span><select id="ivR"><option>ADMIN</option><option selected>OPERATOR</option><option>ANALYST</option><option>VIEWER</option></select><span class="muted">invite window (days)</span><input id="ivD" value="7" style="max-width:70px"><button onclick="invitePerson()">Invite</button><span id="invRes" class="muted"></span></div>`+
 `<table><tr><th>@handle</th><th>Full name</th><th>Role</th><th>Status</th><th>Expires</th><th>Actions</th></tr>`+
 persons.map(p=>`<tr><td>${p.username||'<span class="muted">pending</span>'}</td><td>${p.fullName}</td><td>${p.role} <span class="muted">L${p.level}</span></td><td>${p.status==='ACTIVE'?'<span class="ok">ACTIVE</span>':p.status==='INVITED'?'<span class="warn">INVITED</span>':'<span class="danger">'+p.status+'</span>'}</td><td>${p.accessExpiryAt?new Date(p.accessExpiryAt).toLocaleDateString():'<span class="muted">never</span>'}</td><td class="row"><button onclick="wkRole('${p.id}')">Role</button><button onclick="wkState('${p.id}',0)">${p.status==='ACTIVE'?'Suspend':'Activate'}</button><button onclick="wkState('${p.id}',1)">Revoke</button><button onclick="wkExpiry('${p.id}')">Expiry</button><button onclick="wkResetPw('${p.id}')">PW</button><button onclick="wkResetPin('${p.id}')">PIN</button></td></tr>`).join('')+`</table>`,true);
 html+=card('Agent identities ('+(stats.agents||agents.length)+')',`<div class="row"><span class="muted">name</span><input id="agN" placeholder="settle-bot"><span class="muted">purpose</span><input id="agP" placeholder="payment settlement"><button onclick="createAgentRow()">Create agent</button></div>`+
 (agents.length?`<table><tr><th>Name</th><th>Purpose</th><th>Status</th><th>Last used</th></tr>`+agents.map(a=>`<tr><td>${a.name}</td><td class="muted">${a.purpose||''}</td><td>${a.status}</td><td class="muted">${a.lastUsedAt?new Date(a.lastUsedAt).toLocaleString():'never'}</td></tr>`).join('')+`</table>`:'<span class="muted">No agent identities yet.</span>'),true);
 document.getElementById('app').innerHTML=html;}
async function provisionFounder(){const r=await api('/workforce/provision-founder',{method:'POST',body:JSON.stringify({fullName:fN.value,username:fU.value,password:fP.value,pin:fPin.value})});alert(r.success?'Founder provisioned'+(r.person?.username?' as @'+r.person.username:'')+'.':'Error: '+r.error);if(r.success)renderWorkforce();}
async function invitePerson(){const r=await api('/workforce/invite',{method:'POST',body:JSON.stringify({fullName:ivN.value,role:ivR.value,expiresInDays:Number(ivD.value||7)})});if(r.success){document.getElementById('invRes').textContent='Invite code: '+r.inviteCode;setTimeout(renderWorkforce,1200);}else{document.getElementById('invRes').textContent='Error: '+(r.error||'failed');}}
async function wkRole(id){const role=prompt('Target role (ADMIN/OPERATOR/ANALYST/VIEWER):');if(!role)return;const which=(['ADMIN','OPERATOR'].includes(role.toUpperCase()))?'promote':'demote';const r=await api('/workforce/'+id+'/'+which,{method:'POST',body:JSON.stringify({role:role.toUpperCase()})});alert(r.success?'Done':'Error: '+r.error);renderWorkforce();}
async function wkState(id,suspend){const which=suspend?'suspend':'activate';const r=await api('/workforce/'+id+'/'+which,{method:'POST',body:JSON.stringify({})});alert(r.success?'Done':'Error: '+r.error);renderWorkforce();}
async function wkExpiry(id){const days=prompt('Set access expiry in days (0 = clear/never):');if(days===null)return;const r=await api('/workforce/'+id+'/expiry',{method:'PATCH',body:JSON.stringify({accessExpiryAt:Number(days)>0?new Date(Date.now()+Number(days)*86400000).toISOString():null})});alert(r.success?'Done':'Error: '+r.error);renderWorkforce();}
async function wkResetPw(id){const np=prompt('New password (8+ chars):');if(!np)return;const r=await api('/workforce/'+id+'/reset-password',{method:'POST',body:JSON.stringify({newPassword:np})});alert(r.success?'Password reset.':'Error: '+r.error);}
async function wkResetPin(id){const np=prompt('New 6-digit PIN:');if(!np)return;const r=await api('/workforce/'+id+'/reset-pin',{method:'POST',body:JSON.stringify({newPin:np})});alert(r.success?'PIN reset.':'Error: '+r.error);}
async function createAgentRow(){const r=await api('/workforce/agents',{method:'POST',body:JSON.stringify({name:agN.value,purpose:agP.value})});alert(r.success?'Agent created':'Error: '+r.error);renderWorkforce();}
async function renderAnnouncements(){if(!authState.token){renderLogin();return;}
 const j=await api('/announcements/admin');const items=j.announcements||[];
 document.getElementById('app').innerHTML=card('Publish announcement',`<label>Kind</label><select id="anK"><option>NEWS</option><option>BULLETIN</option><option>ANNOUNCEMENT</option><option>ADVERT</option></select><label>Title</label><input id="anT" placeholder="System maintenance tonight"><label>Body (optional)</label><textarea id="anB" rows="3"></textarea><label>Link (optional)</label><input id="anL" placeholder="https://…"><label>Active</label><select id="anA"><option value="true">Active</option><option value="false">Draft</option></select><label>Expire in days (0 = no expiry)</label><input id="anE" value="0"><button onclick="createAn()">Publish</button>`,true)+
 card('Announcements ('+items.length+')',(items.length?`<table><tr><th>Kind</th><th>Title</th><th>Status</th><th>Expires</th><th>Created</th><th>Actions</th></tr>`+items.map(a=>`<tr><td>${a.kind}</td><td>${a.title}${a.link?'<br><span class="muted"><a href="'+a.link+'" target="_blank" rel="noopener">'+a.link+'</a></span>':''}</td><td>${a.active?'<span class="ok">ACTIVE</span>':'<span class="muted">DRAFT</span>'}</td><td class="muted">${a.expiresAt?new Date(a.expiresAt).toLocaleDateString():'never'}</td><td class="muted">${new Date(a.createdAt).toLocaleString()}</td><td><button onclick="editAn('${a.id}')">Edit</button><button onclick="delAn('${a.id}')">Delete</button></td></tr>`).join('')+`</table>`:'<span class="muted">No announcements yet.</span>'),true);}
async function createAn(){const days=Number(anE.value||0);const r=await api('/announcements',{method:'POST',body:JSON.stringify({kind:anK.value,title:anT.value,body:anB.value,link:anL.value,active:anA.value==='true',expiresAt:days>0?new Date(Date.now()+days*86400000).toISOString():null})});alert(r.success?'Published':'Error: '+r.error);renderAnnouncements();}
async function editAn(id){const t=prompt('Title:');if(t===null)return;const b=prompt('Body:');if(b===null)return;const l=prompt('Link:');if(l===null)return;const r=await api('/announcements/'+id,{method:'PATCH',body:JSON.stringify({title:t,body:b,link:l})});alert(r.success?'Updated':'Error: '+r.error);renderAnnouncements();}
async function delAn(id){if(!confirm('Delete this announcement?'))return;const r=await api('/announcements/'+id,{method:'DELETE'});alert(r.success?'Deleted':'Error: '+r.error);renderAnnouncements();}
async function renderAudit(){if(!authState.token){renderLogin();return;}
 const j=await api('/audit?limit=200');const entries=j.entries||[];
 document.getElementById('app').innerHTML=card('Identity & actions audit ledger ('+j.count+')',(entries.length?`<table><tr><th>At</th><th>Type</th><th>Actor</th><th>Details</th></tr>`+entries.map(e=>{const pl=e.payload||e.data||{};const actor=(pl.actor!=null?pl.actor:(pl.by!=null?pl.by:(pl.subject!=null?pl.subject:'—')));return `<tr><td class="muted">${e.timestamp?new Date(e.timestamp).toLocaleString():'—'}</td><td>${(pl.type||e.type||e.topic||'')}</td><td class="muted">${actor}</td><td><pre style="max-height:90px;margin:0">${JSON.stringify(pl).replace(/</g,'&lt;')}</pre></td></tr>`}).join('')+`</table>`:'<span class="muted">No audit entries yet.</span>'),true);}
function show(v,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');if(!authState.token&&v!=='overview'){renderLogin();return;}if(!authState.token){setAuthUI();renderLogin();return;}({overview:renderOverview,intake:renderIntake,connections:renderConnections,channels:renderChannels,partners:renderPartners,settings:renderSettings,capabilities:renderCapabilities,workforce:renderWorkforce,announcements:renderAnnouncements,audit:renderAudit}[v])()}
load();
</script></body></html>
