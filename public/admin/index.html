<div id="config-modal" class="hidden" style="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px"><div style="width:100%;max-width:520px;background:#0c1a2b;border:1px solid #2a4663;border-radius:14px;padding:18px"><h3 id="cfgTitle">Configure channel</h3><div class="muted" id="cfgLive" style="font-size:12px"></div><p class="muted" id="cfgSub">Enter API keys, webhook URLs and secrets. Secrets are stored server-side only.</p><label>Channel / connector</label><input id="cfgChannel" readonly><label>API key / token</label><input id="cfgApiKey" type="password" placeholder="sk-…"><label>Webhook URL</label><input id="cfgWebhook" placeholder="https://…"><label>Provider Endpoint</label><input id="cfgEndpoint" placeholder="https://provider.example/api"><label>Secret</label><input id="cfgSecret" type="password" placeholder="••••••••"><div class="row"><button onclick="submitChannelConfig()">Save configuration</button><button onclick="closeConfigModal()">Cancel</button></div><div id="cfgMsg" class="muted"></div></div></div>
<script src="/js/ade-pin-state.js"></script>
<script>
const A='/api/v1'; let data={};
// Canonical authentication: the token issued by POST /api/v1/auth/pin is held
// in-session and attached to every protected request. Nothing is hardcoded.
let authState={token:sessionStorage.getItem('ade_admin_token')||null};
function getCookie(n){try{const m=String(document.cookie||'').match(new RegExp('(?:^|;\\s*)'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}catch{return null;}}
function hasSessionCookies(){try{return Boolean(getCookie('ade_token'))&&Boolean(getCookie('ade_elevated'));}catch{return false;}}
function verifySessionCookies(){try{if(authState.token&&!hasSessionCookies()){/* token in memory but elevation cookies missing (e.g. page switch) — keep token, do NOT logout-redirect; re-validate role instead */fetchRole().catch(()=>{});return false;}return true;}catch{return false;}}
// Server-truth role: resolved from GET /api/v1/account/session after auth.
// canWorkforce mirrors the server requireWorkforceAdmin gate (FOUNDER/ADMIN/
// OPERATOR + verified PIN, or legacy bootstrap ADMIN). UI hiding is display
// only — every write is still server-authorized.
let authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};
function canWorkforce(){return authRole.isLegacy||(((authRole.role==='FOUNDER'||authRole.role==='ADMIN'||authRole.role==='OPERATOR'))&&authRole.pinVerified===true);}
function canManagePeople(){return authRole.isLegacy||(((authRole.role==='FOUNDER'||authRole.role==='ADMIN'))&&authRole.pinVerified===true);}
function canProvisionFounder(){return authRole.isLegacy||(authRole.role==='FOUNDER'&&authRole.pinVerified===true);}
function invitableRoles(){const role=authRole.isLegacy?'ADMIN':authRole.role;if(role==='FOUNDER')return ['ADMIN','OPERATOR','ANALYST','VIEWER'];if(role==='ADMIN')return ['OPERATOR','ANALYST','VIEWER'];return ['ANALYST','VIEWER'];}
function roleLabel(){if(!authState.token)return '';if(!authRole.checked)return 'Authenticated session (validating role…)';return '@'+(authRole.role||'—')+' · L'+(authRole.level||0)+(authRole.pinVerified?' · ELEVATED':' · BASE')+(authRole.isLegacy?' · BOOTSTRAP':'');}
function setElevBanner(){try{const elevated=!!authState.token&&authRole.checked===true&&(authRole.pinVerified===true||authRole.isLegacy===true);const b=document.getElementById('elevBanner');if(b){b.classList.toggle('hidden',!elevated);b.style.display=elevated?'':'none';b.textContent=elevated?(authRole.isLegacy?'@ADMIN · L2 · ELEVATED':('@'+String(authRole.role||'—')+' · L'+(authRole.level||0)+' · ELEVATED')):'ELEVATED';}}catch{}}
function setAuthUI(){try{if(typeof setElevBanner==='function')setElevBanner();}catch{}const authed=!!authState.token;const bar=document.getElementById('authbar');if(bar){bar.classList.toggle('hidden',!authed);bar.style.display=authed?'flex':'none';}document.getElementById('tabs').classList.toggle('hidden',!authed);document.getElementById('authinfo').textContent=authed?roleLabel():'';if(!authed&&typeof closeConfigModal==='function'){try{closeConfigModal();}catch{}}paintTabs();}
function paintTabs(){const show=!!authState.token&&authRole.checked&&canWorkforce();document.querySelectorAll('#tabs .tab[data-v]').forEach(b=>{const v=b.getAttribute('data-v');if(v==='workforce'||v==='announcements'||v==='audit'){b.style.display=show?'':'none';}});}
let roleFetchInFlight=null;
async function fetchRole(){
  if(roleFetchInFlight)return roleFetchInFlight;
  roleFetchInFlight=(async()=>{
    authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};if(!authState.token){setAuthUI();return;}
    try{const s=await Promise.race([api('/account/session'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('ROLE_CHECK_TIMEOUT')),8000))]);if(s&&(s.person||s.claims)){const p=s.person||{};const c=s.claims||{};try{window.ADE_PIN_STATE&&ADE_PIN_STATE.hydrateFromClaims({person:p,claims:c})}catch{}const legacy=(p.id===null||p.id===undefined)&&String(c.persona||'').toUpperCase()==='ADMIN';const role=String(p.role||c.role||'').toUpperCase()||'—';authRole={role,level:Number(p.level!=null?p.level:c.level)||0,persona:String(c.persona||'').toUpperCase()||'—',pinVerified:c.pinVerified===true,isLegacy:legacy,checked:true};}}catch{}setAuthUI();
  })().finally(()=>{roleFetchInFlight=null;});
  return roleFetchInFlight;
}
async function api(path,opt){const headers={'Content-Type':'application/json'};const usedToken=authState.token;if(usedToken)headers['Authorization']='Bearer '+usedToken;const r=await fetch(A+path,{...opt,headers:Object.assign({},headers,(opt&&opt.headers)||{})});
 if(r.status===401){if(authState.token!==usedToken)return{success:false,error:'STALE_REQUEST_IGNORED',stale:true};authState.token=null;sessionStorage.removeItem('ade_admin_token');try{window.ADE_PIN_STATE&&ADE_PIN_STATE.clear()}catch{}setAuthUI();renderLogin('Session required for this operation.','AUTH_REQUIRED');return{success:false,error:'UNAUTHORIZED'};}
 if(r.status===403){const b=await r.json().catch(()=>({}));const code=typeof b.error==='string'?b.error:'FORBIDDEN';if(code==='ACCOUNT_NOT_ACTIVE'||code==='ACCESS_EXPIRED'){if(authState.token!==usedToken)return{success:false,error:'STALE_REQUEST_IGNORED',stale:true};authState.token=null;sessionStorage.removeItem('ade_admin_token');try{window.ADE_PIN_STATE&&ADE_PIN_STATE.clear()}catch{}setAuthUI();renderLogin('Authorization expired �?" re-authenticate.','AUTH_REQUIRED');return{success:false,error:'UNAUTHORIZED'};}return{success:false,error:code,message:b.message||'Insufficient authorization for this operation.'};}
 if(r.status===503){const b=await r.json().catch(()=>({}));if(b.error==='AUTH_NOT_CONFIGURED'||b.error==='INITIAL_PIN_HASH_REQUIRED'){authState.token=null;sessionStorage.removeItem('ade_admin_token');try{window.ADE_PIN_STATE&&ADE_PIN_STATE.clear()}catch{}setAuthUI();renderLogin('Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).','AUTH_NOT_CONFIGURED');return{success:false,error:'AUTH_NOT_CONFIGURED'};}return{success:false,error:b.error||'SERVICE_UNAVAILABLE',message:b.message||'Service temporarily unavailable'};}
 return r.json();}
function loginFailureText(status,body){const code=String((body&&body.error)||'');if(status===503||code==='AUTH_STORAGE_UNAVAILABLE'||code==='STORAGE_NOT_CONFIGURED')return (body&&body.message)||'Authentication storage is unavailable. Sign-in is blocked to prevent false credential failures.';if(status===429||code==='RATE_LIMIT_EXCEEDED')return 'Too many attempts �?" wait briefly and retry.';if(status>=500)return 'Authentication service failed �?" check connectivity and retry. Do not assume the credential is wrong.';if(code==='INVALID_CREDENTIALS'||status===401)return null;return (body&&body.message)||('Authentication failed ('+(code||status)+').');}
function loginCard(msg){return `<h3>Authentication & Identity Control</h3><p class="muted">Authentication & Session Step-Up Gateway — administration and command operations. Choose the credential path issued for you; elevation is always requested and verified server-side.</p><div class="authBlock"><div class="authBlockTitle">Workforce identity <span class="pill muted" style="font-size:10px">FOUNDER · ADMIN · OPERATOR</span></div><p class="muted authHint">Username and password establish the workforce session; the Authorization PIN (6 digits) completes the server-side step-up before command operations unlock.</p><label for="loginUser">Username</label><input id="loginUser" autocomplete="username" placeholder="your assigned username"><label for="loginPw">Password</label><div class="passWrap"><input id="loginPw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')founderLoginSubmit()"><button type="button" class="showToggle" onclick="togglePw('loginPw',this)" aria-label="Show or hide password" title="Show or hide password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label for="loginFPin">6 digits Authorization PIN</label><div class="passWrap"><input id="loginFPin" type="password" autocomplete="one-time-code" placeholder="6 digits Authorization PIN" onkeydown="if(event.key==='Enter')founderLoginSubmit()"><button type="button" class="showToggle" onclick="togglePw('loginFPin',this)" aria-label="Show or hide PIN" title="Show or hide PIN"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button onclick="founderLoginSubmit()" aria-label="Sign in with username, password and the 6-digit step-up PIN"><strong>Submit</strong></button></div><hr style="border-color:#20324a;margin:14px 0"><div class="authBlock"><div class="authBlockTitle">Administrator authorization PIN <span class="pill warn" style="font-size:10px">LEGACY L2</span></div><p class="muted authHint">Bootstrap and recovery credential for the administrator session — administrators only — not a workforce identity.</p><label for="loginPin">6 digits Authorization PIN</label><div class="passWrap"><input id="loginPin" name="admin-recovery-pin" type="password" autocomplete="one-time-code" placeholder="6 digits Authorization PIN" onkeydown="if(event.key==='Enter')loginSubmit()"><button type="button" class="showToggle" onclick="toggleAdminPin()" aria-label="Show or hide PIN" title="Show or hide PIN"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button onclick="loginSubmit()" aria-label="Sign in with the administrator authorization PIN"><strong>Submit</strong></button></div><p id="authMsg" class="warn">${msg||''}</p><p class="muted" style="font-size:12px">Use the credential issued for your role. The gateway confirms elevation before unlocking command operations.</p>`;}
function toggleAdminPin(){const i=document.getElementById('loginPin');const b=i&&i.nextElementSibling;if(!i||!b)return;togglePw('loginPin',b);}
const EYE_OPEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_SHUT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function togglePw(id,btn){const i=document.getElementById(id);if(!i)return;i.type=i.type==='password'?'text':'password';const b=btn||(i.nextElementSibling||null);if(b){b.innerHTML=i.type==='password'?EYE_OPEN:EYE_SHUT;b.setAttribute('aria-label',i.type==='password'?'Show':'Hide');}}
function renderLogin(msg,code){data={};document.getElementById('app').innerHTML='<section class="card wide">'+loginCard(msg)+'</section>';const pin=document.getElementById('loginPin');if(pin&&code==='AUTH_REQUIRED')pin.focus();}
let loginSubmitBusy=false,founderLoginBusy=false;
async function loginSubmit(){if(loginSubmitBusy)return;const pin=(document.getElementById('loginPin')||{}).value;if(!pin)return;const msgEl=document.getElementById('authMsg');loginSubmitBusy=true;if(msgEl)msgEl.textContent='Authenticating administrator PIN…';try{const r=await fetch(A+'/auth/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const body=await r.json();
  if(body.success&&body.token){authState.token=body.token;sessionStorage.setItem('ade_admin_token',body.token);try{window.ADE_PIN_STATE&&ADE_PIN_STATE.set({method:'ADMIN_RECOVERY',role:'ADMIN_L2',level:2})}catch{}if(msgEl)msgEl.textContent='';await fetchRole();if(!authState.token)return;load();}
  else{const friendly=loginFailureText(r.status,body);if(msgEl)msgEl.textContent=(body.error==='AUTH_NOT_CONFIGURED')?'Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).':(body.error==='INVALID_CREDENTIALS')?'Invalid Administrator authorization PIN — check and retry.':(friendly||'Authentication failed ('+(body.error||r.status)+').');}}
  catch(e){if(msgEl)msgEl.textContent='Sign-in failed — check connectivity and retry.';}
  finally{loginSubmitBusy=false;}}
async function founderLoginSubmit(){if(founderLoginBusy)return;const u=(document.getElementById('loginUser')||{}).value||'';const pw=(document.getElementById('loginPw')||{}).value||'';const fp=(document.getElementById('loginFPin')||{}).value||'';const msgEl=document.getElementById('authMsg');if(!u||!pw||!fp){if(msgEl)msgEl.textContent='Username, password and the 6-digit Authorization PIN are all required.';return;}founderLoginBusy=true;if(msgEl)msgEl.textContent='Verifying identity and step-up PIN against the server…';try{const l=await fetch(A+'/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:pw})});const lb=await l.json().catch(()=>({}));if(!lb.success||!lb.token){const failure=loginFailureText(l.status,lb);if(msgEl)msgEl.textContent=failure||'Invalid username or password — check and retry.';return;}const p=await fetch(A+'/account/pin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+lb.token},body:JSON.stringify({pin:fp})});const pb=await p.json().catch(()=>({}));if(!pb.success||!pb.token){const failure=loginFailureText(p.status,pb);if(msgEl)msgEl.textContent=(pb.error==='INVALID_PIN')?'Invalid Authorization PIN — check and retry.':(failure||'Authorization PIN verification failed ('+(pb.error||p.status)+').');return;}authState.token=pb.token;sessionStorage.setItem('ade_admin_token',pb.token);try{window.ADE_PIN_STATE&&ADE_PIN_STATE.set({method:'PIN',subject:u})}catch{}if(msgEl)msgEl.textContent='';await fetchRole();if(!authState.token)return;load();}catch(e){if(msgEl)msgEl.textContent='Sign-in failed — check connectivity and retry.';}finally{founderLoginBusy=false;}}
async function logout(){const t=authState.token;authState.token=null;authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};sessionStorage.removeItem('ade_admin_token');try{closeSSE();}catch{}try{window.ADE_PIN_STATE&&ADE_PIN_STATE.clear()}catch{}try{localStorage.removeItem('ade_admin_token');localStorage.removeItem('ade_token');sessionStorage.removeItem('ade_token');}catch{}try{for(const n of ['ade_token','ade_elevated']){document.cookie=n+'=; Path=/; Max-Age=0; SameSite=Lax';}}catch{}data={};setAuthUI();renderLogin('Signed out.','AUTH_REQUIRED');if(t){try{await fetch(A+'/auth/revoke',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});}catch{}try{await fetch(A+'/account/logout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});}catch{} }}

let cfgChannelId=null;
// Modal opens ONLY from an explicit authorized click (channel card / badge /
// Configure button). It holds no persistent state: cfgChannelId is in-memory,
// nothing is written to storage/history, so reload, Back/Forward, logout or
// session expiry can never resurrect a stale modal.
function openConfigModal(id,label){if(!authState.token)return;cfgChannelId=id;try{document.getElementById('cfgChannel').value=label||id;document.getElementById('cfgTitle').textContent='Configure '+(label||id);document.getElementById('cfgMsg').textContent='';document.getElementById('config-modal').classList.remove('hidden');document.getElementById('config-modal').style.display='flex';const k=document.getElementById('cfgApiKey');if(k)k.focus();}catch{}}
function clearConfigSecrets(){try{for(const n of ['cfgApiKey','cfgWebhook','cfgEndpoint','cfgSecret']){const el=document.getElementById(n);if(el)el.value='';}}catch{}}
function closeConfigModal(){cfgChannelId=null;try{clearConfigSecrets();document.getElementById('config-modal').classList.add('hidden');document.getElementById('config-modal').style.display='none';}catch{}}
try{document.getElementById('config-modal').addEventListener('mousedown',function(e){if(e.target&&e.target.id==='config-modal')closeConfigModal();});}catch{}
try{document.addEventListener('keydown',function(e){if(e&&e.key==='Escape'){try{const m=document.getElementById('config-modal');if(m&&!m.classList.contains('hidden'))closeConfigModal();}catch{}}});}catch{}
async function submitChannelConfig(){try{if(!cfgChannelId){document.getElementById('cfgMsg').textContent='Error: no channel selected — reopen the Configure dialog from a channel card.';return;}const apiKey=document.getElementById('cfgApiKey').value;const webhookUrl=document.getElementById('cfgWebhook').value;const baseUrl=document.getElementById('cfgEndpoint').value;const secret=document.getElementById('cfgSecret').value;if(!apiKey&&!webhookUrl&&!baseUrl&&!secret){document.getElementById('cfgMsg').textContent='Error: enter at least one of API key, webhook URL, provider endpoint or secret.';return;}document.getElementById('cfgMsg').textContent='Saving…';const body={channelId:cfgChannelId,apiKey,webhookUrl,baseUrl,secret};const r=await api('/connect/channels/configure',{method:'POST',body:JSON.stringify(body)});document.getElementById('cfgMsg').textContent=r&&r.success?('Saved ('+(r.channel||cfgChannelId)+')'):'Error: '+((r&&r.error)||'failed');if(r&&r.success){closeConfigModal();renderChannels();}}catch(e){document.getElementById('cfgMsg').textContent='Error: '+(e.message||'failed');}}
async function loadPartnerEndpoints(){try{const j=await api('/connect/partner-endpoints');return (j&&j.endpoints)||[];}catch{return [];}}
async function load(){if(!authState.token){setAuthUI();renderLogin();return;}try{if(typeof verifySessionCookies==="function")verifySessionCookies();}catch{}const r=await Promise.all([fetchRole(),api('/admin/overview').catch(()=>({success:false,error:'FETCH_FAILED'}))]);if(!authState.token)return;data=r[1]||{};if(data&&!data.success&&data.error==='UNAUTHORIZED')return;routeFromHash();}
function card(t,b,wide=false){return `<section class="card ${wide?'wide':''}"><h3>${t}</h3>${b}</section>`}
// State-coded pills: AVAILABLE/ACTIVATED/CONNECTED/VERIFIED read green;
// CONFIGURATION_REQUIRED/NOT_CONFIGURED/DISABLED read amber; failures red.
function pillFor(s){s=String(s==null?'':s).toUpperCase().trim();if(/^(ENABLED|ON|CONNECTED|VERIFIED|ESTABLISHED|ACTIVATED|AVAILABLE|CONFIGURED|READY|LIVE|YES)$/.test(s))return 'pill good';if(/^(TEST|CONFIGURATION_REQUIRED|AUTHORIZATION REQUIRED|NOT_CONFIGURED|NOT CONFIGURED|UNCONFIGURED|DISABLED|OFF|UNKNOWN|PENDING|NO|NONE)$/.test(s))return 'pill warn';if(/^(SUSPENDED|FAILED|ERROR|REVOKED|BLOCKED|REJECTED)$/.test(s))return 'pill bad';return 'pill muted';}
// Truthful section errors: a failed section call renders an explicit inline
// error state (server-declined vs unreachable) with a retry — never a silent
// empty list that could read as "nothing exists yet".
function errState(j){if(!j)return{code:'SERVER_UNREACHABLE',kind:'network',message:''};if(j.success===false)return{code:j.error||'REQUEST_FAILED',kind:'declined',message:j.message||''};return null;}
function errCard(what,j,retryFn){const e=errState(j);if(!e)return '';return '<section class="card wide"><h3>'+what+'</h3><p class="warn">Section state unavailable — '+(e.kind==='network'?'the server did not answer this request (network or server restart)':'the operation was declined by the server: '+e.code)+'.</p>'+(e.message?'<p class="muted">'+String(e.message).replace(/</g,'&lt;')+'</p>':'')+'<div class="row"><button onclick="'+retryFn+'()">Retry '+what+'</button></div></section>';}
// === Shared telemetry stream (single-connection contract) =====================
// Exactly ONE EventSource per console session. Overview and Live panes bind to
// this singleton and repaint from a bounded in-memory log. No render path
// re-enters load(), so section navigation can never multiply SSE connections
// or bounce the operator back to Overview.
let sse=null;const sseLog=[];
function ensureSSE(){if(sse&&sse.readyState!==2)return sse;try{if(sse)sse.close();}catch{}try{sse=new EventSource('/api/v1/events/stream');sse.onopen=()=>{sseOverride('<span class="ok">● SSE CONNECTED</span>');};sse.onmessage=(e)=>{try{const d=JSON.parse(e.data);if(d.type==='STREAM_CONNECTED'){sseOverride(sseLog.length?'':'<div class="muted">STREAM_CONNECTED · '+new Date().toLocaleTimeString()+' · canonical event bus connected — events appear here in real time as operators, integrations and the system act.</div>');return;}const ts=(d.meta&&d.meta.timestamp)||d.timestamp||new Date().toISOString();let tstr=ts;try{tstr=new Date(ts).toLocaleTimeString();}catch{}const label=String(d.type||d.topic||'EVENT').slice(0,48);const keys=d.payload&&typeof d.payload==='object'?Object.keys(d.payload).slice(0,5).join(', '):String(d.payload||'').slice(0,120);const cls=(/SECURITY_EVENT/.test(label)?'pill bad':/TRADE_SIGNAL/.test(label)?'pill good':/AUTH_STEP_UP/.test(label)?'pill warn':/SYSTEM_PING/.test(label)?'pill muted':'pill');sseLog.unshift({at:tstr,label,keys,cls});if(sseLog.length>30)sseLog.length=30;paintLog();}catch{}};sse.onerror=()=>{sseOverride('<span class="warn">SSE reconnecting…</span>');};}catch{}return sse;}
function sseOverride(html){const el=document.getElementById('sse');if(el)el.innerHTML=html;}
function paintLog(){const row=(x,withKeys)=>'<div class="row"><span class="muted">'+x.at+'</span><span class="pill">'+x.label+'</span>'+(withKeys?'<span class="muted">'+String(x.keys).replace(/</g,'&lt;').slice(0,120)+'</span>':'')+'</div>';const overview=document.getElementById('sse');if(overview)overview.innerHTML=(sseLog.map(x=>row(x,true)).join('')||'<div class="muted">Connected — waiting for events…</div>');const live=document.getElementById('sseLive');if(live)live.innerHTML=(sseLog.map(x=>row(x,false)).join('')||'<div class="muted">Connected — waiting for events…</div>');}
function closeSSE(){try{if(sse){sse.close();sse=null;}}catch{}try{sseLog.length=0;}catch{}}

 card('Founder decisions ('+dc.length+')',`<label>Opportunity</label><select id="comDecOpp">${opp.map(o=>`<option value="${cEsc(o.id)}">${cEsc(o.title)}</option>`).join('')}</select><label>Decision</label><select id="comDecType">${cOpts(['CONTINUE','REVISE','EXPAND','PAUSE','STOP'])}</select><label>Rationale (required)</label><input id="comDecRationale"><label>Evidence ref (required)</label><input id="comDecEvidence"><button onclick="commercialDecision()">Record Founder decision</button><p class="muted">Server-enforced FOUNDER-only. A non-Founder session receives an honest 403 — no client-side bypass, no fabricated recommendation.</p>`+(dc.length?`<table><tr><th>Decision</th><th>Rationale</th><th>By</th><th>At</th></tr>`+dc.map(d=>`<tr><td><span class="pill">${cEsc(d.decision)}</span></td><td class="muted">${cEsc((d.rationale||'').slice(0,120))}</td><td class="muted">${cEsc(d.decidedBy||'—')}</td><td class="muted">${d.decidedAt?new Date(d.decidedAt).toLocaleString():'—'}</td></tr>`).join('')+`</table>`:'<span class="muted">No decisions recorded.</span>'),true);}

function tabFor(v){try{let b=document.querySelector('#tabs .tab[data-v="'+v+'"]');if(b)return b;const all=[...document.querySelectorAll('#tabs .tab')];return all.find(x=>String(x.getAttribute('onclick')||'').includes("show('"+v+"'"))||null;}catch{return null;}}
// Hash routing: the section is part of the URL, so refresh and Back/Forward
// restore the operator's position. show() is the only writer (replaceState —
// no history spam, no re-entrant hashchange loop); hashchange re-routes.
function show(v,el){try{if(('#'+v)!==String(location.hash||''))history.replaceState(null,'','#'+v);}catch{}if(!el)el=tabFor(v);document.querySelectorAll('.tab').forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current');});el?.classList.add('active');el?.setAttribute('aria-current','page');if(!authState.token&&v!=='overview'){renderLogin();return;}if(!authState.token){setAuthUI();renderLogin();return;}if((v==='workforce'||v==='announcements'||v==='audit')&&authRole.checked&&!canWorkforce()){document.getElementById('app').innerHTML='<section class="card wide"><h3>'+v+'</h3><p class="muted">Elevation required — this surface needs a FOUNDER/ADMIN/OPERATOR session with a verified authorization PIN. The server enforces this boundary.</p></section>';return;}(SECTIONS[v]||renderOverview)()}
function routeFromHash(){try{const h=String(location.hash||'').replace(/^#/,'');show(SECTIONS[h]?h:'overview',null);}catch{show('overview',null);}}
try{window.addEventListener('hashchange',function(){try{routeFromHash();}catch{}});}catch{}
document.querySelectorAll('#tabs .tab').forEach(b=>{try{const m=/show\('([a-z]+)'/.exec(String(b.getAttribute('onclick')||''));if(m&&m[1])b.setAttribute('data-v',m[1]);}catch{}});
