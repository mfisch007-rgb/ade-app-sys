<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADE Control Plane</title><style>
body{font-family:system-ui;margin:0;background:#07111f;color:#eef5ff}header{padding:18px 24px;border-bottom:1px solid #20324a;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(10px)}h1{margin:0;font-size:22px}.sub{color:#8fa4bd;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;padding:20px}.card{background:#0c1a2b;border:1px solid #20324a;border-radius:14px;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}.tab,button{background:#12243a;border:1px solid #2a4663;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tab.active{background:#17436a}.pill{padding:4px 8px;border-radius:99px;background:#173a2c;color:#86efac;font-size:12px}.muted{color:#8fa4bd}.hidden{display:none}input,select,textarea{width:100%;box-sizing:border-box;background:#07111f;color:#fff;border:1px solid #2a4663;border-radius:8px;padding:9px;margin:5px 0 10px}label{font-size:12px;color:#9fb2c9}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #20324a;text-align:left;font-size:13px}.wide{grid-column:1/-1}.ok{color:#86efac}.warn{color:#facc15}.danger{color:#f87171}pre{white-space:pre-wrap;max-height:400px;overflow:auto;background:#050b13;padding:12px;border-radius:8px}
</style></head><body><header><h1>ADE Command & Control Plane</h1><div class="sub">What-you-see-is-what-you-configure • runtime administration without source-code editing</div></header><div class="tabs"><button class="tab active" onclick="show('overview',this)">Overview</button><button class="tab" onclick="show('intake',this)">Intake / Cases</button><button class="tab" onclick="show('connections',this)">Connections</button><button class="tab" onclick="show('channels',this)">Channels</button><button class="tab" onclick="show('partners',this)">Partners</button><button class="tab" onclick="show('settings',this)">Settings</button><button class="tab" onclick="show('capabilities',this)">Capabilities</button></div>
<main id="app" class="grid"></main>
<script>
const A='/api/v1'; let data={};
async function api(path,opt){const r=await fetch(A+path,{headers:{'Content-Type':'application/json'},...opt});return r.json()}
async function load(){data=await api('/admin/overview'); renderOverview();}
function card(t,b,wide=false){return `<section class="card ${wide?'wide':''}"><h3>${t}</h3>${b}</section>`}
function renderOverview(){document.getElementById('app').innerHTML=[card('Runtime',`<div class="ok">● Control plane online</div><p class="muted">Cases: ${data.cases.length} • Connections: ${data.connections.length} • Partners: ${data.partners.length}</p>`),card('Inbound channels',data.channels.map(c=>`<div class="row"><b>${c.label}</b><span class="pill">${c.enabled?'ENABLED':'DISABLED'}</span><span class="muted">${c.configured?'configured':'configuration pending'}</span></div>`).join('')),card('Autonomous operating loop',`<p>Demand → Intake → Entity → Case → Discovery → Assessment → Decision → Partner/Agent → Execution → Verification → Outcome</p><div class="ok">Unified case model is active.</div>`),card('Live event stream',`<div id="sse">Connecting…</div>`,true)].join('');
 const es=new EventSource('/api/v1/events/stream'); es.onopen=()=>document.getElementById('sse').innerHTML='<span class="ok">● SSE CONNECTED</span>'; es.onmessage=e=>document.getElementById('sse').textContent=e.data; es.onerror=()=>document.getElementById('sse').innerHTML='<span class="warn">SSE reconnecting…</span>';
}
async function renderIntake(){const j=await api('/cases');document.getElementById('app').innerHTML=card('Create business opportunity',`<label>Channel</label><select id="ch">${data.channels.map(c=>`<option>${c.id}</option>`).join('')}</select><label>Company</label><input id="co" placeholder="ABC Manufacturing Ltd"><label>Contact email</label><input id="em" placeholder="ops@example.com"><label>Business request</label><textarea id="tx" rows="5" placeholder="We use Odoo and need procurement, inventory and production workflows integrated."></textarea><label><input id="pa" type="checkbox" style="width:auto"> Authorize public business analysis</label><button onclick="createCase()">Create & Evaluate</button>`,true)+card('Cases',j.cases.map(c=>`<div class="card"><b>${c.id}</b> <span class="pill">${c.status}</span><p>${c.organization||'Unknown organization'} — ${c.request.intent}</p><small class="muted">${c.channel} • confidence ${(c.confidence*100).toFixed(0)}% • next: ${c.nextAction}</small></div>`).join('')||'<span class="muted">No cases yet.</span>',true)}
async function createCase(){const r=await api('/intake/'+document.getElementById('ch').value,{method:'POST',body:JSON.stringify({company:document.getElementById('co').value,email:document.getElementById('em').value,text:document.getElementById('tx').value,authorization:{publicAnalysis:document.getElementById('pa').checked}})}); alert(r.success?'Case '+r.case.id+' created':'Error: '+r.error); renderIntake()}
async function renderConnections(){const j=await api('/admin/connections');document.getElementById('app').innerHTML=card('Add connection',`<label>Provider</label><input id="p" placeholder="Odoo / SAP / Google / SMTP / Telegram"><label>Connection type</label><select id="t"><option>REST_API</option><option>WEBHOOK</option><option>SMTP</option><option>IMAP</option><option>OAUTH2</option></select><label>Base URL</label><input id="u" placeholder="https://example.com/api"><label>Authentication</label><select id="a"><option>API_KEY</option><option>OAUTH2</option><option>BEARER</option><option>BASIC</option><option>NONE</option></select><label>Secret / token (never displayed again)</label><input id="s" type="password"><button onclick="addConn()">Save Connection</button>`,false)+card('Configured connections',j.connections.map(c=>`<div class="row"><b>${c.provider}</b><span class="pill">${c.status}</span><span class="muted">${c.baseUrl||'no URL'}</span><button onclick="testConn('${c.id}')">Test</button></div>`).join('')||'<span class="muted">None</span>',true)}
async function addConn(){const r=await api('/admin/connections',{method:'POST',body:JSON.stringify({provider:p.value,type:t.value,baseUrl:u.value,authType:a.value,secret:s.value})});alert(r.success?'Saved':'Error: '+r.error);renderConnections()} async function testConn(id){alert(JSON.stringify(await api('/admin/connections/'+id+'/test'),null,2))}
async function renderChannels(){const j=await api('/admin/channels');document.getElementById('app').innerHTML=card('Inbound channel fabric',j.channels.map(c=>`<div class="row" style="margin:8px 0"><b>${c.label}</b><span class="pill">${c.enabled?'ON':'OFF'}</span><button onclick="toggleCh('${c.id}',${!c.enabled})">${c.enabled?'Disable':'Enable'}</button></div>`).join(''),true)} async function toggleCh(id,enabled){await api('/admin/channels/'+id,{method:'PATCH',body:JSON.stringify({enabled})});renderChannels()}
async function renderPartners(){const j=await api('/admin/partners');document.getElementById('app').innerHTML=card('Partner registry',`<label>Partner</label><input id="pn" placeholder="A2MPro"><label>Capabilities (comma separated)</label><input id="pc" placeholder="ERP integration, API integration, workflow automation, data migration"><button onclick="addPartner()">Register / Update Partner</button>`,false)+card('Registered partners',j.partners.map(p=>`<div><b>${p.name}</b> <span class="pill">${p.status}</span><p class="muted">${p.capabilities.join(' • ')}</p></div>`).join('')||'<span class="muted">None</span>',true)} async function addPartner(){await api('/admin/partners',{method:'POST',body:JSON.stringify({name:pn.value,capabilities:pc.value.split(',').map(x=>x.trim()).filter(Boolean),status:'EVALUATION'})});renderPartners()}
async function renderSettings(){const j=await api('/admin/settings');document.getElementById('app').innerHTML=card('Runtime policy & UI settings',`<label>Community partner mode</label><select id="pm"><option value="high-access">High-access bounded partner evaluation</option><option value="standard">Standard Community</option></select><label>Demo mode</label><select id="dm"><option value="true">Enabled</option><option value="false">Disabled</option></select><label>Human approval threshold</label><select id="ha"><option>CONSEQUENTIAL_ACTIONS_ONLY</option><option>ALL_EXTERNAL_WRITES</option></select><button onclick="saveSettings()">Save settings</button><pre>${JSON.stringify(j.settings,null,2)}</pre>`,true)} async function saveSettings(){await api('/admin/settings',{method:'PATCH',body:JSON.stringify({policies:{partnerMode:pm.value,demoMode:dm.value==='true',humanApproval:ha.value}})});renderSettings()}
async function renderCapabilities(){const j=await api('/capabilities');document.getElementById('app').innerHTML=card('Self-discovering capability fabric',`<p class="muted">${j.capabilities.length} authoritative capabilities exposed to the UI.</p><table><tr><th>Capability</th><th>RBAC</th><th>Tier</th><th>Runtime</th></tr>${j.capabilities.map(c=>`<tr><td>${c.name}</td><td>${c.rbacLevel}</td><td>${c.tier}</td><td class="ok">${c.runtimeBound?'YES':'NO'}</td></tr>`).join('')}</table>`,true)}
function show(v,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');({overview:renderOverview,intake:renderIntake,connections:renderConnections,channels:renderChannels,partners:renderPartners,settings:renderSettings,capabilities:renderCapabilities}[v])()}
load();
</script></body></html>
