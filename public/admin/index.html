<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADE Control Plane</title><link rel="icon" type="image/png" href="/ADE-LOGO.png"><link rel="apple-touch-icon" href="/ADE-LOGO.png"><style>
body{font-family:system-ui;margin:0;background:#07111f;color:#eef5ff}header{padding:18px 24px;border-bottom:1px solid #20324a;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(10px)}h1{margin:0;font-size:22px}.sub{color:#8fa4bd;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(12px,2.5vw,16px);padding:clamp(14px,3vw,24px);max-width:1440px;margin:0 auto;width:100%}.card{background:#0c1a2b;border:1px solid #20324a;border-radius:14px;padding:16px;overflow-x:auto;max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}.tab,button{background:#12243a;border:1px solid #2a4663;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tab.active{background:#17436a}.pill{padding:4px 8px;border-radius:99px;background:#173a2c;color:#86efac;font-size:12px}.muted{color:#8fa4bd}.hidden{display:none}input,select,textarea{width:100%;box-sizing:border-box;background:#07111f;color:#fff;border:1px solid #2a4663;border-radius:8px;padding:9px;margin:5px 0 10px}label{font-size:12px;color:#9fb2c9}table{width:100%;border-collapse:collapse;max-width:100%}td,th{padding:8px;border-bottom:1px solid #20324a;text-align:left;font-size:13px;white-space:nowrap}.wide{grid-column:1/-1}.ok{color:#86efac}.warn{color:#facc15}.danger{color:#f87171}pre{white-space:pre-wrap;max-height:400px;overflow:auto;background:#050b13;padding:12px;border-radius:8px}.passWrap{position:relative;display:flex;align-items:center;gap:6px}.passWrap input{flex:1;padding-right:64px}.passWrap .showToggle{background:transparent;border:none;color:#86efac;font-size:11.5px;font-weight:700;cursor:pointer;min-height:36px;padding:0 10px;letter-spacing:.04em;white-space:nowrap}.passWrap .showToggle:hover{text-decoration:underline}
</style></head><body><header><div class="row"><img src="/ADE-LOGO.png" alt="ADE logo" style="width:40px;height:40px;object-fit:contain"><div><h1>ADE Command & Control Plane</h1><div class="sub">What-you-see-is-what-you-configure • runtime administration without source-code editing</div></div><div id="authbar" class="hidden" style="margin-left:auto"><span class="muted" id="authinfo"></span><button onclick="logout()">Logout</button></div></div></header><div class="tabs" id="tabs"><button class="tab active" onclick="show('overview',this)">Overview</button><button class="tab" onclick="show('intake',this)">Intake / Cases</button><button class="tab" onclick="show('organization',this)">Organization</button><button class="tab" onclick="show('connections',this)">Connections</button><button class="tab" onclick="show('channels',this)">Channels</button><button class="tab" onclick="show('partners',this)">Partners</button><button class="tab" onclick="show('settings',this)">Settings</button><button class="tab" onclick="show('capabilities',this)">Capabilities</button><button class="tab" data-v="workforce" onclick="show('workforce',this)">Workforce</button><button class="tab" data-v="announcements" onclick="show('announcements',this)">Announcements</button><button class="tab" onclick="show('providers',this)">Providers</button><button class="tab" onclick="show('payments',this)">Payments</button><button class="tab" onclick="show('financial',this)">Financial</button><button class="tab" onclick="show('operations',this)">Operations</button><button class="tab" data-v="audit" onclick="show('audit',this)">Audit</button></div>
<main id="app" class="grid"></main>
<script>
const A='/api/v1'; let data={};
// Canonical authentication: the token issued by POST /api/v1/auth/pin is held
// in-session and attached to every protected request. Nothing is hardcoded.
let authState={token:sessionStorage.getItem('ade_admin_token')||null};
// Server-truth role: resolved from GET /api/v1/account/session after auth.
// canWorkforce mirrors the server requireWorkforceAdmin gate (FOUNDER/ADMIN/
// OPERATOR + verified PIN, or legacy bootstrap ADMIN). UI hiding is display
// only — every write is still server-authorized.
let authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};
function canWorkforce(){return authRole.isLegacy||(((authRole.role==='FOUNDER'||authRole.role==='ADMIN'||authRole.role==='OPERATOR'))&&authRole.pinVerified===true);}
function canProvisionFounder(){return authRole.isLegacy||(authRole.role==='FOUNDER'&&authRole.pinVerified===true);}
function roleLabel(){if(!authState.token)return '';if(!authRole.checked)return 'Authenticated session (validating role…)';return '@'+(authRole.role||'—')+' · L'+(authRole.level||0)+(authRole.pinVerified?' · ELEVATED':' · BASE')+(authRole.isLegacy?' · BOOTSTRAP':'');}
function setAuthUI(){const authed=!!authState.token;document.getElementById('authbar').classList.toggle('hidden',!authed);document.getElementById('tabs').classList.toggle('hidden',!authed);document.getElementById('authinfo').textContent=authed?roleLabel():'';paintTabs();}
function paintTabs(){const show=!!authState.token&&authRole.checked&&canWorkforce();document.querySelectorAll('#tabs .tab[data-v]').forEach(b=>{const v=b.getAttribute('data-v');if(v==='workforce'||v==='announcements'||v==='audit'){b.style.display=show?'':'none';}});}
async function fetchRole(){authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};if(!authState.token){setAuthUI();return;}try{const s=await api('/account/session');if(s&&(s.person||s.claims)){const p=s.person||{};const c=s.claims||{};const legacy=(p.id===null||p.id===undefined)&&String(c.persona||'').toUpperCase()==='ADMIN';const role=String(p.role||c.role||'').toUpperCase()||'—';authRole={role,level:Number(p.level!=null?p.level:c.level)||0,persona:String(c.persona||'').toUpperCase()||'—',pinVerified:c.pinVerified===true,isLegacy:legacy,checked:true};}}catch{}setAuthUI();}
async function api(path,opt){const headers={'Content-Type':'application/json'};if(authState.token)headers['Authorization']='Bearer '+authState.token;const r=await fetch(A+path,{...opt,headers:Object.assign({},headers,(opt&&opt.headers)||{})});
 if(r.status===401){authState.token=null;sessionStorage.removeItem('ade_admin_token');setAuthUI();renderLogin('Session required for this operation.','AUTH_REQUIRED');return{success:false,error:'UNAUTHORIZED'};}
 if(r.status===403){const b=await r.json().catch(()=>({}));const code=typeof b.error==='string'?b.error:'FORBIDDEN';if(code==='ACCOUNT_NOT_ACTIVE'||code==='ACCESS_EXPIRED'){authState.token=null;sessionStorage.removeItem('ade_admin_token');setAuthUI();renderLogin('Authorization expired — re-authenticate.','AUTH_REQUIRED');return{success:false,error:'UNAUTHORIZED'};}return{success:false,error:code,message:b.message||'Insufficient authorization for this operation.'};}
 if(r.status===503){authState.token=null;sessionStorage.removeItem('ade_admin_token');setAuthUI();renderLogin('Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).','AUTH_NOT_CONFIGURED');return{success:false,error:'AUTH_NOT_CONFIGURED'};}
 return r.json();}
function loginCard(msg){return `<h3>Administrator authentication</h3><p class="muted">This control plane requires an authenticated level-2 session via the canonical <code>/api/v1/auth/pin</code> flow.</p><label>Admin PIN</label><div class="passWrap"><input id="loginPin" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter')loginSubmit()"><button type="button" class="showToggle" onclick="toggleAdminPin()" aria-label="Show or hide PIN" title="Show or hide PIN">SHOW</button></div><button onclick="loginSubmit()">Authenticate</button><p id="authMsg" class="warn">${msg||''}</p>`;}
function toggleAdminPin(){const i=document.getElementById('loginPin');const b=i&&i.nextElementSibling;if(!i||!b)return;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'SHOW':'HIDE';}
function renderLogin(msg,code){data={};document.getElementById('app').innerHTML='<section class="card wide">'+loginCard(msg)+'</section>';const pin=document.getElementById('loginPin');if(pin&&code==='AUTH_REQUIRED')pin.focus();}
async function loginSubmit(){const pin=(document.getElementById('loginPin')||{}).value;if(!pin)return;const r=await fetch(A+'/auth/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const body=await r.json();
  if(body.success&&body.token){authState.token=body.token;sessionStorage.setItem('ade_admin_token',body.token);document.getElementById('authMsg')&&(document.getElementById('authMsg').textContent='');await fetchRole();if(!authState.token)return;load();}
 else{document.getElementById('authMsg')&&(document.getElementById('authMsg').textContent=(body.error==='AUTH_NOT_CONFIGURED')?'Authentication is not configured on this runtime (AUTH_NOT_CONFIGURED).':(body.error==='INVALID_CREDENTIALS')?'Invalid PIN — check credentials and retry.':'Authentication failed ('+(body.error||r.status)+').');}}
async function logout(){const t=authState.token;authState.token=null;authRole={role:'—',level:0,persona:'—',pinVerified:false,isLegacy:false,checked:false};sessionStorage.removeItem('ade_admin_token');data={};setAuthUI();renderLogin('Signed out.','AUTH_REQUIRED');if(t){try{await fetch(A+'/auth/revoke',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});}catch{} }}
async function load(){if(!authState.token){setAuthUI();renderLogin();return;}await fetchRole();if(!authState.token)return;data=await api('/admin/overview');if(data&&!data.success&&data.error==='UNAUTHORIZED')return;renderOverview();}
function card(t,b,wide=false){return `<section class="card ${wide?'wide':''}"><h3>${t}</h3>${b}</section>`}
function renderOverview(){document.getElementById('app').innerHTML=[card('Runtime',`<div class="ok">● Control plane online</div><p class="muted">Cases: ${(data.cases||[]).length} • Connections: ${(data.connections||[]).length} • Partners: ${(data.partners||[]).length}</p>`),card('Inbound channels',(data.channels||[]).map(c=>`<div class="row"><b>${c.label}</b><span class="pill">${c.enabled?'ENABLED':'DISABLED'}</span><span class="muted">${c.configured?'configured':'configuration pending'}</span></div>`).join('')),card('Autonomous operating loop',`<p>Demand → Intake → Entity → Case → Discovery → Assessment → Decision → Partner/Agent → Execution → Verification → Outcome</p><div class="ok">Unified case model is active.</div>`),card('Live event stream',`<div id="sse">Connecting…</div>`,true)].join('');
  const es=new EventSource('/api/v1/events/stream'); es.onopen=()=>document.getElementById('sse').innerHTML='<span class="ok">● SSE CONNECTED</span>'; es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='STREAM_CONNECTED')return;const keys=d.payload&&typeof d.payload==='object'?Object.keys(d.payload).slice(0,5).join(', '):'';document.getElementById('sse').innerHTML='<span class="pill">'+String(d.type||d.topic||'EVENT').slice(0,48)+'</span> <span class="muted">'+keys.slice(0,120)+'</span>';}catch{}}; es.onerror=()=>document.getElementById('sse').innerHTML='<span class="warn">SSE reconnecting…</span>';
}
async function renderIntake(){if(!authState.token){renderLogin();return;}const j=await api('/cases');document.getElementById('app').innerHTML=card('Create business opportunity',`<label>Channel</label><select id="ch">${(data.channels||[]).map(c=>`<option>${c.id}</option>`).join('')}</select><label>Company</label><input id="co" placeholder="ABC Manufacturing Ltd"><label>Contact email</label><input id="em" placeholder="ops@example.com"><label>Business request</label><textarea id="tx" rows="5" placeholder="We use Odoo and need procurement, inventory and production workflows integrated."></textarea><label><input id="pa" type="checkbox" style="width:auto"> Authorize public business analysis</label><button onclick="createCase()">Create & Evaluate</button>`,true)+card('Cases',(j.cases||[]).map(c=>`<div class="card"><b>${c.id}</b> <span class="pill">${c.status}</span><p>${c.organization||'Unknown organization'} — ${c.request.intent}</p><small class="muted">${c.channel} • confidence ${(c.confidence*100).toFixed(0)}% • next: ${c.nextAction}</small></div>`).join('')||'<span class="muted">No cases yet.</span>',true)}
async function createCase(){const r=await api('/intake/'+document.getElementById('ch').value,{method:'POST',body:JSON.stringify({company:document.getElementById('co').value,email:document.getElementById('em').value,text:document.getElementById('tx').value,authorization:{publicAnalysis:document.getElementById('pa').checked}})}); alert(r.success?'Case '+r.case.id+' created':'Error: '+r.error); renderIntake()}
async function renderOrganization(){if(!authState.token){renderLogin();return;}
 let u,c,t,a,av;try{[u,c,t,a,av]=await Promise.all([api('/org/units'),api('/customers'),api('/field/tasks?limit=25'),api('/agents'),api('/commerce/availability?capabilities=ORG_UNITS,CUSTOMERS,FIELD_TASKS,AI_WORKERS,AWBULI_SIMULATED,PAYSTACK_LIVE')]);}catch(e){u=c=t=a=av=null;}
 const units=(u&&u.units)||[];
 const tree={};units.forEach(x=>{tree[x.unitId]=x;});
 const roots=units.filter(x=>!x.parentId);
 const availLbl=(k)=>{const f=(av&&av.availability||[]).find(y=>y.capability===k);return f?f.availability:'—';};
 document.getElementById('app').innerHTML=
 card('Organization units ('+units.length+')',`<label>Organization name</label><input id="ouOrg" placeholder="Acme Foods Ltd"><button onclick="orgCreate()">Create organization</button><div id="ouTree" style="margin-top:8px">`+(roots.length?roots.map(r=>`<div class="row"><b>${r.name}</b><span class="pill">${r.type}</span><button onclick="ouAdd('${r.unitId}','BRANCH')">+ Branch</button><button onclick="ouAdd('${r.unitId}','DEPARTMENT')">+ Dept</button><button onclick="ouTree('${r.unitId}')">Tree</button></div>`).join(''):'<span class="muted">No organization yet — create one to represent branches, departments and teams.</span>')+`</div><pre id="ouOut"></pre>`,true)+
 card('Customers / leads ('+((c&&c.customers)||[]).length+')  <span class="pill">'+availLbl('CUSTOMERS')+'</span>',`<label>Name</label><input id="cuN" placeholder="Jane Doe"><label>Phone</label><input id="cuP" placeholder="+234..."><button onclick="custAdd()">Register</button><div style="margin-top:8px">`+((c&&c.customers||[]).slice(0,15).map(x=>`<div class="row"><b>${x.name}</b><span class="pill">${x.state}</span><button onclick="custTo('${x.customerId}')">Advance</button></div>`).join('')||'<span class="muted">None yet.</span>')+`</div>`,false)+
 card('Field tasks ('+((t&&t.tasks)||[]).length+')  <span class="pill">'+availLbl('FIELD_TASKS')+'</span>',`<label>Title</label><input id="ftT" placeholder="Restock Ikeja shop"><label>Kind</label><select id="ftK"><option>VISIT</option><option>TASK</option><option>DELIVERY</option><option>COLLECTION</option><option>SALE</option><option>INSPECTION</option><option>EVIDENCE</option><option>SUPPORT</option></select><button onclick="taskAdd()">Create task</button><div style="margin-top:8px">`+((t&&t.tasks||[]).slice(0,15).map(x=>`<div class="row"><b>${x.title}</b><span class="pill">${x.state}</span><span class="muted">${x.assignee?x.assignee.id:'unassigned'}</span><button onclick="taskClaimId('${x.taskId}')">Claim</button></div>`).join('')||'<span class="muted">None yet.</span>')+`</div>`,false)+
 card('AI workers ('+((a&&a.agents)||[]).length+')  <span class="pill">'+availLbl('AI_WORKERS')+'</span>',`<p class="muted">Bind an existing workforce agent identity to capabilities. Runs execute through the CapabilityRegistry only — never silent, always audited.</p><label>Agent ID (from Workforce tab)</label><input id="agId" placeholder="agent id"><label>Capabilities (comma separated, must exist)</label><input id="agCaps" placeholder="ORG_UNITS, CUSTOMERS"><button onclick="agentBind()">Bind agent</button><div style="margin-top:8px">`+((a&&a.agents||[]).map(x=>`<div class="row"><b>${x.name}</b><span class="pill">${x.status}</span><span class="muted">${(x.capabilities||[]).join(', ')}</span></div>`).join('')||'<span class="muted">None bound.</span>')+`</div>`,true);}
async function orgCreate(){const n=document.getElementById('ouOrg').value;if(!n)return alert('Name required');const r=await api('/org/units',{method:'POST',body:JSON.stringify({type:'ORGANIZATION',name:n,reason:'org setup'})});alert(r.success?('Created '+r.unit.name):'Error: '+(r.error||'failed'));renderOrganization();}
async function ouAdd(pid,type){const n=prompt(type+' name:');if(!n)return;const r=await api('/org/units',{method:'POST',body:JSON.stringify({type,name:n,parentId:pid,reason:'org setup'})});alert(r.success?'Created':'Error: '+(r.error||'failed'));renderOrganization();}
async function ouTree(id){const r=await api('/org/units/'+encodeURIComponent(id)+'/ancestry');document.getElementById('ouOut').textContent=r.success?r.ancestry.map(x=>x.type+': '+x.name).join(' → '):'Error: '+(r.error||'failed');}
async function custAdd(){const r=await api('/customers',{method:'POST',body:JSON.stringify({name:cuN.value,phone:cuP.value})});alert(r.success?('Registered '+r.customer.state+(r.customer.duplicate?' (duplicate merged)':'')):'Error: '+(r.error||'failed'));renderOrganization();}
async function custTo(id){const to=prompt('Next state (CONTACT/QUALIFIED/CASE/SERVICE/FOLLOW_UP/RETAINED/LOST):');if(!to)return;const r=await api('/customers/'+encodeURIComponent(id)+'/transition',{method:'POST',body:JSON.stringify({to,reason:'operator advance'})});alert(r.success?('State: '+r.customer.state):'Error: '+(r.error||'failed'));renderOrganization();}
async function taskAdd(){const r=await api('/field/tasks',{method:'POST',body:JSON.stringify({kind:ftK.value,title:ftT.value})});alert(r.success?('Created '+r.task.state):'Error: '+(r.error||'failed'));renderOrganization();}
async function taskClaimId(id){const r=await api('/field/tasks/'+encodeURIComponent(id)+'/transition',{method:'POST',body:JSON.stringify({to:'CLAIMED',actor:'operator',actorKind:'HUMAN'})});alert(r.success?('Claimed by '+r.task.assignee.id):'Error: '+(r.error||'failed'));renderOrganization();}
async function agentBind(){const r=await api('/agents/bind',{method:'POST',body:JSON.stringify({agentId:agId.value,capabilities:agCaps.value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean),reason:'agent setup'})});alert(r.success?('Bound '+r.binding.name):'Error: '+(r.error||'failed'));renderOrganization();}
async function renderConnections(){if(!authState.token){renderLogin();return;}const j=await api('/admin/connections');document.getElementById('app').innerHTML=card('Add connection',`<label>Provider</label><input id="p" placeholder="Odoo / SAP / Google / SMTP / Telegram"><label>Connection type</label><select id="t"><option>REST_API</option><option>WEBHOOK</option><option>SMTP</option><option>IMAP</option><option>OAUTH2</option></select><label>Base URL</label><input id="u" placeholder="https://example.com/api"><label>Authentication</label><select id="a"><option>API_KEY</option><option>OAUTH2</option><option>BEARER</option><option>BASIC</option><option>NONE</option></select><label>Secret / token (never displayed again)</label><input id="s" type="password"><button onclick="addConn()">Save Connection</button>`,false)+card('Configured connections',(j.connections||[]).map(c=>`<div class="row"><b>${c.provider}</b><span class="pill">${c.status}</span><span class="muted">${c.baseUrl||'no URL'}</span><button onclick="testConn('${c.id}')">Test</button></div>`).join('')||'<span class="muted">None</span>',true)}
async function addConn(){const r=await api('/admin/connections',{method:'POST',body:JSON.stringify({provider:p.value,type:t.value,baseUrl:u.value,authType:a.value,secret:s.value})});alert(r.success?'Saved':'Error: '+r.error);renderConnections()} async function testConn(id){alert(JSON.stringify(await api('/admin/connections/'+id+'/test',{method:'POST'}),null,2))}
async function renderChannels(){if(!authState.token){renderLogin();return;}const j=await api('/admin/channels');document.getElementById('app').innerHTML=card('Inbound channel fabric',(j.channels||[]).map(c=>`<div class="row" style="margin:8px 0"><b>${c.label}</b><span class="pill">${c.enabled?'ON':'OFF'}</span><button onclick="toggleCh('${c.id}',${!c.enabled})">${c.enabled?'Disable':'Enable'}</button></div>`).join(''),true)} async function toggleCh(id,enabled){await api('/admin/channels/'+id,{method:'PATCH',body:JSON.stringify({enabled})});renderChannels()}
async function renderPartners(){if(!authState.token){renderLogin();return;}const j=await api('/admin/partners');document.getElementById('app').innerHTML=card('Partner registry',`<label>Partner</label><input id="pn" placeholder="A2MPro"><label>Capabilities (comma separated)</label><input id="pc" placeholder="ERP integration, API integration, workflow automation, data migration"><button onclick="addPartner()">Register / Update Partner</button>`,false)+card('Registered partners',(j.partners||[]).map(p=>`<div><b>${p.name}</b> <span class="pill">${p.status}</span><p class="muted">${(p.capabilities||[]).join(' • ')}</p></div>`).join('')||'<span class="muted">None</span>',true)} async function addPartner(){await api('/admin/partners',{method:'POST',body:JSON.stringify({name:pn.value,capabilities:pc.value.split(',').map(x=>x.trim()).filter(Boolean),status:'EVALUATION'})});renderPartners()}
async function renderSettings(){if(!authState.token){renderLogin();return;}const j=await api('/admin/settings');document.getElementById('app').innerHTML=card('Runtime policy & UI settings',`<label>Community partner mode</label><select id="pm"><option value="high-access">High-access bounded partner evaluation</option><option value="standard">Standard Community</option></select><label>Demo mode</label><select id="dm"><option value="true">Enabled</option><option value="false">Disabled</option></select><label>Human approval threshold</label><select id="ha"><option>CONSEQUENTIAL_ACTIONS_ONLY</option><option>ALL_EXTERNAL_WRITES</option></select><button onclick="saveSettings()">Save settings</button><pre>${JSON.stringify(j.settings,null,2)}</pre>`,true)} async function saveSettings(){await api('/admin/settings',{method:'PATCH',body:JSON.stringify({policies:{partnerMode:pm.value,demoMode:dm.value==='true',humanApproval:ha.value}})});renderSettings()}
async function renderCapabilities(){if(!authState.token){renderLogin();return;}const j=await api('/capabilities');document.getElementById('app').innerHTML=card('Self-discovering capability fabric',`<p class="muted">${(j.capabilities||[]).length} authoritative capabilities exposed to the UI.</p><table><tr><th>Capability</th><th>RBAC</th><th>Tier</th><th>Runtime</th></tr>${(j.capabilities||[]).map(c=>`<tr><td>${c.name}</td><td>${c.rbacLevel}</td><td>${c.tier}</td><td class="ok">${c.runtimeBound?'YES':'NO'}</td></tr>`).join('')}</table>`,true)}
async function renderWorkforce(){if(!authState.token){renderLogin();return;}
 if(!authRole.checked){document.getElementById('app').innerHTML=card('Workforce','<p class="muted">Validating session role…</p>',true);await fetchRole();if(!authState.token||!authRole.checked)return;}
 if(!canWorkforce()){document.getElementById('app').innerHTML=card('Workforce','<p class="muted">Elevation required — workforce management needs a FOUNDER/ADMIN/OPERATOR session with a verified authorization PIN. The server enforces this boundary; nothing was fetched.</p>',true);return;}
 const j=await api('/workforce');if(j&&!j.success&&j.error==='UNAUTHORIZED')return;const persons=(j&&j.persons)||[];const agents=(j&&j.agents)||[];const stats=(j&&j.stats)||{};let html='';
 if((!persons.length||!stats.founderProvisioned)&&canProvisionFounder()){html+=card('Provision founder (first-run only)',`<p class="muted">No workforce account exists yet. The founder credential is the only bootstrap account. After provisioning, invite or provision other workforce members here.</p><label>Username</label><input id="fU" placeholder="founder"><label>Full name</label><input id="fN" placeholder="Ade Foundation"><label>Password (8+ chars)</label><div style="display:flex;gap:6px;align-items:center"><input id="fP" type="password" style="flex:1"><button type="button" onclick="const i=document.getElementById('fP');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'" style="min-width:60px">Show</button></div><label>PIN (6 digits)</label><div style="display:flex;gap:6px;align-items:center"><input id="fPin" type="password" style="flex:1"><button type="button" onclick="const i=document.getElementById('fPin');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'" style="min-width:60px">Show</button></div><button onclick="provisionFounder()">Provision founder account</button>`,true);}

 document.getElementById('app').innerHTML=card('Identity & actions audit ledger ('+j.count+')',(entries.length?`<table><tr><th>At</th><th>Type</th><th>Actor</th><th>Details</th></tr>`+entries.map(e=>{const pl=e.payload||e.data||{};const actor=(pl.actor!=null?pl.actor:(pl.by!=null?pl.by:(pl.subject!=null?pl.subject:'—')));return `<tr><td class="muted">${e.timestamp?new Date(e.timestamp).toLocaleString():'—'}</td><td>${(pl.type||e.type||e.topic||'')}</td><td class="muted">${actor}</td><td><pre style="max-height:90px;margin:0">${JSON.stringify(pl).replace(/</g,'&lt;')}</pre></td></tr>`}).join('')+`</table>`:'<span class="muted">No audit entries yet.</span>'),true);}
function show(v,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');if(!authState.token&&v!=='overview'){renderLogin();return;}if(!authState.token){setAuthUI();renderLogin();return;}if((v==='workforce'||v==='announcements'||v==='audit')&&authRole.checked&&!canWorkforce()){document.getElementById('app').innerHTML='<section class="card wide"><h3>'+v+'</h3><p class="muted">Elevation required — this surface needs a FOUNDER/ADMIN/OPERATOR session with a verified authorization PIN. The server enforces this boundary.</p></section>';return;}({overview:renderOverview,intake:renderIntake,organization:renderOrganization,connections:renderConnections,channels:renderChannels,partners:renderPartners,settings:renderSettings,capabilities:renderCapabilities,workforce:renderWorkforce,announcements:renderAnnouncements,providers:renderProviders,payments:renderPayments,financial:renderFinancial,operations:renderOps,audit:renderAudit}[v])()}
load();
</script></body></html>
