<title>ADE APEX — Autonomous Event-Driven Operations Platform</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{
 --bg:#f5f2eb;--bg2:#ece8df;--surface:rgba(255,255,255,.9);--surface2:rgba(255,255,255,.62);
 --ocean:#061a40;--royal:#0a3d91;--blue:#1b5fdc;--cyan:#0bb6d2;--coral:#ef3b52;
 --ink:#0b1c36;--muted:#5a6a85;--faint:#7c89a1;
 --line:rgba(6,26,64,.13);--lineSoft:rgba(6,26,64,.08);
 --good:#12906a;--warn:#c58a16;--bad:#d93a4e;
 --shadow:0 22px 60px rgba(6,26,64,.12);--shadowSm:0 10px 30px rgba(6,26,64,.08);
 --radius:18px;--radiusSm:12px;
 --focusRing:0 0 0 3px rgba(11,182,210,.18);
 --gold1:#b8860b;--gold2:#daa520;--gold3:#ffd700;
 --page-gutter:32px;--content-max:1240px;
 --header-height:92px;--nav-height:48px;
 --section-gap:26px;--card-gap:16px;--panel-padding:20px;
 --touch:44px;
}
*{box-sizing:border-box;min-width:0}html,body,#root{margin:0;width:100%;max-width:100%}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 18% -8%,rgba(11,182,210,.10),transparent 60%),radial-gradient(1100px 700px at 92% 6%,rgba(27,95,220,.12),transparent 55%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:clip}
.app{min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;height:auto}
pre{white-space:pre-wrap;word-break:break-word}
button{font-family:inherit}
a{color:var(--royal)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:650;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--royal);background:#fff;box-shadow:var(--shadowSm)}
.btn.primary{background:linear-gradient(135deg,var(--royal),var(--blue));border-color:rgba(6,26,64,.3);color:#fff;box-shadow:0 8px 24px rgba(10,61,145,.28)}
.btn.primary:hover{background:linear-gradient(135deg,#0c4bb0,#2467e8);color:#fff}
.btn.azure{background:linear-gradient(135deg,rgba(11,182,210,.14),rgba(27,95,220,.1));border-color:rgba(11,182,210,.4);color:var(--royal)}
.btn.coral{background:linear-gradient(135deg,rgba(239,59,82,.12),rgba(239,59,82,.05));border-color:rgba(239,59,82,.35);color:#b9273a}
.btn.sm{min-height:44px;min-width:44px;padding:7px 13px;font-size:12.5px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--royal);font-weight:700}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn:focus-visible{outline:none;box-shadow:var(--focusRing);border-color:var(--cyan)}
.iconBtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch);min-width:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;transition:.18s}
.iconBtn:hover{border-color:var(--cyan);color:var(--royal)}
.iconBtn:focus-visible{outline:none;box-shadow:var(--focusRing);border-color:var(--cyan)}
.card{transition:transform .18s, box-shadow .18s, border-color .18s}
.card:hover{border-color:rgba(6,26,64,.18)}
.btn:active{transform:translateY(1px)}
.cap:focus-visible{outline:none;box-shadow:var(--focusRing)}
.search:focus-visible{outline:none;box-shadow:var(--focusRing)}
/* ── Header ────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;width:100%;background:rgba(245,242,235,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--lineSoft);transition:box-shadow .2s;box-shadow:0 10px 34px rgba(6,26,64,.06)}
.top.scrolled{box-shadow:0 6px 26px rgba(6,26,64,.10)}
.topInner{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 0 8px;flex-wrap:nowrap;min-width:0}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.brand img{width:clamp(50px,6.4vw,80px);height:clamp(50px,6.4vw,80px);object-fit:contain;transition:.22s}
.top.scrolled .brand img{width:clamp(46px,5vw,60px);height:clamp(46px,5vw,60px)}
.brandName strong{display:block;font-size:clamp(13px,1.4vw,15.5px);letter-spacing:.11em;color:var(--ocean);line-height:1.15;white-space:nowrap}
.brandName span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.12em;margin-top:3px;text-transform:uppercase;white-space:nowrap}
.brand-name{display:block;font-size:8.5px;color:var(--faint);letter-spacing:.1em;margin-top:2px;text-transform:uppercase;white-space:nowrap}
.brandName strong{display:block}
.topIdentity{display:flex;flex-direction:column;gap:3px;flex:0 1 auto;min-width:0;padding:0 4px;border-left:1px solid var(--lineSoft);padding-left:16px}
.topIdentity .idMain{font-size:clamp(8.5px,1vw,10.5px);font-weight:900;letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(135deg,#b8860b 0%,#daa520 18%,#ffd700 36%,#daa520 54%,#b8860b 72%,#8b6914 88%,#b8860b 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topIdentity .idSub{font-size:clamp(7.5px,.86vw,9px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topMotto{display:flex;justify-content:center;align-items:center;padding:7px 0;width:100%;border-top:1px solid var(--lineSoft);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(249,247,242,.9));min-height:var(--nav-height)}
.topMottoInner{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0}
.topMottoLine{font-size:clamp(10px,1.1vw,13px);font-weight:750;letter-spacing:.14em;color:var(--ocean);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.topMottoLine em{color:var(--coral);font-style:normal}
.topNav{display:flex;align-items:center;gap:2px;flex:1 1 auto;justify-content:flex-end;flex-wrap:nowrap;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;min-width:0}
.topNav::-webkit-scrollbar{display:none}
.topNav button{all:unset;cursor:pointer;min-height:44px;padding:7px 10px;border-radius:11px;color:#3c4d68;font-size:12.5px;font-weight:600;border:1px solid transparent;transition:.16s;white-space:nowrap;flex:none}
.topNav button:hover{color:var(--ocean);background:rgba(255,255,255,.7)}
.topNav button.active{color:var(--royal);background:#fff;border-color:var(--lineSoft);box-shadow:var(--shadowSm)}
.topNav button.ops{color:var(--coral)}
.topNav button.ops.active{color:#fff;background:linear-gradient(135deg,var(--coral),#f07a8c);border-color:transparent}
.topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.headerContact{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;padding:2px 8px;border-left:1px solid var(--lineSoft);min-width:0}
.headerContact a,.headerContact span{font-size:11px;color:var(--muted);text-decoration:none;white-space:nowrap;line-height:1.4}
.headerContact a:hover{color:var(--royal)}
.headerContact .contact-label{color:var(--faint);font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
.headerContact .contact-row{display:flex;align-items:center;gap:6px;min-height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:10px;font-weight:750;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn);flex:none}
.pill.live .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
.pill.off .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:3px 9px;border-radius:99px;font-size:9.5px;font-weight:800;letter-spacing:.08em;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.community{color:var(--royal);border-color:rgba(27,95,220,.35);background:rgba(27,95,220,.07)}
.badge.pro{color:var(--warn);border-color:rgba(197,138,22,.4);background:rgba(197,138,22,.07)}
.badge.enterprise{color:var(--coral);border-color:rgba(239,59,82,.4);background:rgba(239,59,82,.07)}
.badge.good{color:var(--good);border-color:rgba(18,144,106,.4);background:rgba(18,144,106,.07)}
.badge.bad{color:var(--bad);border-color:rgba(217,58,78,.4);background:rgba(217,58,78,.07)}
.badge.muted{color:var(--muted);border-color:var(--line)}
.hamburger{display:none}
.topRight .btn span.hideL{display:none}
/* mobile menu */
.mobileMenu{display:none;border-top:1px solid var(--lineSoft);background:rgba(255,255,255,.98);padding:10px 16px 18px;gap:4px}
.mobileMenu.open{display:grid}
.mobileMenu button{all:unset;cursor:pointer;min-height:48px;padding:12px 12px;border-radius:12px;color:#3c4d68;font-size:15px;font-weight:650;border:1px solid transparent}
.mobileMenu button:hover,.mobileMenu button.active{color:var(--royal);background:rgba(27,95,220,.07);border-color:var(--lineSoft)}
.mobileMenu button.ops{color:var(--coral)}
.mobileMenu .sub{font-size:11px;color:var(--faint);padding:12px 12px 4px;letter-spacing:.16em;font-weight:800}
.mobileMenu .identity-line{font-size:10.5px;color:var(--muted);padding:10px 12px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;background:linear-gradient(135deg,#b8860b,#daa520 40%,#ffd700 55%,#b8860b);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.4}
.mobileMenu .contact-line{padding:10px 12px 2px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.mobileMenu .contact-line a{color:var(--royal)}
.mobileMenu a{color:var(--royal);text-decoration:none;min-height:48px;padding:13px 12px;font-size:14.5px;border-radius:12px;font-weight:600}.mobileMenu .sub{border-top:1px solid var(--lineSoft);margin-top:8px}
.mobileMenu .sub.subToggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}
.mobileMenu .sub .chev{font-size:11px;color:var(--royal);flex:none}
.mobileMenu .grp{display:grid;gap:4px}
/* ── Shared ────────────────────────────────── */
.shell{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;padding:var(--section-gap) 0 60px;flex:1}
.card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,255,255,.72));box-shadow:var(--shadowSm);backdrop-filter:blur(10px);min-width:0;max-width:100%}
.card.pad{padding:var(--panel-padding)}
.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--lineSoft);flex-wrap:wrap}
.panelTitle h3{margin:0;font-size:12.5px;letter-spacing:.15em;color:var(--ocean)}
.panelTitle span{font-size:10px;color:var(--muted);letter-spacing:.12em}
.muted{color:var(--muted)}
.eyebrow{color:var(--royal);font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
.cardBody{padding:18px}
.stack{display:grid;gap:var(--section-gap)}
.tableWrap{overflow-x:auto;max-width:100%;padding:0 18px 14px;margin-bottom:2px}
.tableWrap table{min-width:640px;width:100%;border-collapse:collapse;font-size:12.5px}
.tableWrap th{text-align:left;padding:9px 10px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.tableWrap td{padding:10px;border-bottom:1px solid var(--lineSoft);color:#3c4d68;white-space:nowrap}
/* community + feedback: two distinct cards, side by side (1 col <=720px) */
.interactGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--card-gap);align-items:stretch}
.interactGrid .card{min-width:0;max-width:100%}
/* auth + credential feedback */
.authStatus{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;display:flex;align-items:flex-start;gap:8px}
.authStatus.ok{background:rgba(18,144,106,.1);border:1px solid rgba(18,144,106,.4);color:var(--good)}
.authStatus.err{background:rgba(217,58,78,.08);border:1px solid rgba(217,58,78,.38);color:var(--bad)}
.authLoading{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:10px}
.spinner{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--royal);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.toast.ok{background:linear-gradient(135deg,#0c513f,#12906a);color:#fff}
.toast.err{background:linear-gradient(135deg,#7c1830,#d93a4e);color:#fff}
/* credential form groups */
.formGroup{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--lineSoft)}
.formGroup:last-child{padding-bottom:0;border-bottom:none}
.passWrap{position:relative;display:flex;align-items:center}
.passWrap input{width:100%;padding-right:64px}
.passWrap .showToggle{position:absolute;right:6px;background:none;border:none;color:var(--royal);font-size:11.5px;font-weight:700;cursor:pointer;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;letter-spacing:.04em}
.passWrap .showToggle:hover{text-decoration:underline}
.passWrap .showToggle svg{display:block}
.fieldErr{color:var(--bad);font-size:11.5px;margin-top:2px;font-weight:600}
.formHint{color:var(--muted);font-size:11px;line-height:1.5;margin:0}
.formOk{color:var(--good);font-size:11.5px;margin-top:2px;font-weight:600;line-height:1.5}
/* ── Home hero ──────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.55fr);gap:20px}
.heroMain{padding:clamp(22px,4vw,44px);position:relative;overflow:hidden}
.heroMain h1{font-size:clamp(1.95rem,4.6vw,3.6rem);line-height:1.06;margin:14px 0 14px;letter-spacing:-.025em;color:var(--ocean);max-width:760px}
.heroMain p{color:var(--muted);font-size:clamp(0.95rem,1.2vw,1.06rem);line-height:1.65;max-width:660px;margin:0 0 22px}
.heroActions{display:flex;gap:12px;flex-wrap:wrap}
.heroStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--lineSoft)}
.suggestion-label{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:var(--royal);margin:16px 0 8px;text-transform:uppercase}
.suggestion-carousel{position:relative;min-height:78px;overflow:hidden;margin-top:0;border:1px solid var(--lineSoft);border-radius:14px;background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(236,232,223,.6));padding:12px 16px;box-shadow:var(--shadowSm)}
.suggestion-text{position:absolute;inset:12px 16px 12px 16px;display:flex;align-items:center;animation:suggestionFade 30s infinite;opacity:0;font-size:clamp(14.5px,1.7vw,16.5px);line-height:1.6;color:var(--ocean);font-style:normal;font-weight:600;white-space:normal;overflow:hidden;cursor:pointer;background:none;border:none;text-align:left;width:auto;border-radius:8px}
.suggestion-text:nth-child(1){animation-delay:0s}.suggestion-text:nth-child(2){animation-delay:6s}.suggestion-text:nth-child(3){animation-delay:12s}.suggestion-text:nth-child(4){animation-delay:18s}.suggestion-text:nth-child(5){animation-delay:24s}
.suggestion-carousel:hover .suggestion-text,.suggestion-carousel:focus-within .suggestion-text{animation-play-state:paused}
.suggestion-dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.suggestion-dots button{min-width:44px;min-height:44px;border-radius:99px;border:1px solid var(--lineSoft);background:#fff;color:var(--ocean);font-size:13px;font-weight:700;cursor:pointer;padding:8px 14px}
.suggestion-dots button:hover{border-color:var(--cyan)}
@keyframes suggestionFade{0%,1%{opacity:0;transform:translateY(10px)}3.5%,18.5%{opacity:1;transform:translateY(0)}20.5%,100%{opacity:0;transform:translateY(-10px)}}
@media(max-width:640px){.suggestion-carousel{min-height:104px}.suggestion-text{inset:10px 12px;font-size:14.5px;line-height:1.55}}
.heroStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px 12px;border:1px solid var(--lineSoft);border-radius:14px;background:rgba(255,255,255,.7)}
.stat b{display:block;font-size:clamp(18px,2.6vw,24px);letter-spacing:.02em;color:var(--ocean)}
.stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;margin-top:4px;text-transform:uppercase}
.orb{align-self:stretch;display:grid;place-items:center;min-height:280px;background:radial-gradient(circle at center,rgba(11,182,210,.16),transparent 48%),linear-gradient(150deg,rgba(255,255,255,.6),rgba(236,232,223,.4))}
.orbCore{width:150px;height:150px;border-radius:42% 58% 55% 45%;transform:rotate(17deg);background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(11,182,210,.18) 35%,rgba(27,95,220,.24) 60%,rgba(255,255,255,.4));border:1px solid rgba(6,26,64,.18);box-shadow:inset -14px -16px 30px rgba(6,26,64,.08),inset 10px 8px 22px rgba(255,255,255,.5),0 0 70px rgba(27,95,220,.22);animation:float 6s ease-in-out infinite;display:grid;place-items:center;color:var(--royal);font-weight:900;letter-spacing:.1em}
@keyframes float{50%{transform:rotate(21deg) translateY(-10px)}}
/* value pillars */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.pillar{padding:20px 18px}
.pillar .n{color:var(--royal);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.pillar h4{margin:10px 0 6px;color:var(--ocean);font-size:16px}
.pillar p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
/* products */
.featureGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.feature{padding:22px;display:flex;flex-direction:column;gap:10px}
.feature .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--royal),var(--blue));font-size:14px;letter-spacing:.04em}
.feature .mark.m2{background:linear-gradient(135deg,var(--coral),#f07a8c)}
.feature .mark.m3{background:linear-gradient(135deg,var(--cyan),#37c9df)}
.feature .n{font-size:17px;font-weight:800;color:var(--ocean)}
.feature .d{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.feature .accent{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.productGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.product{padding:16px;border:1px solid var(--lineSoft);border-radius:14px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:8px}
.product .n{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ocean)}
.product .d{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.product .tags{display:flex;flex-wrap:wrap;gap:6px}
/* theater / media */

<script id="ade-interactive-config">
/* ADE INTERACTIVE CONFIGURATION — server-confirmed only. Every element that
   literally reads CONFIGURATION_REQUIRED becomes interactive: it opens the
   canonical configuration dialog. Credentials entered there are sent ONCE to
   the canonical server route POST /api/v1/connect/channels/configure under an
   authenticated Admin/Founder session; the server stores them write-only and
   never echoes them. The browser persists metadata only (channel, endpoint,
   time) and renders the honest state CONFIGURED — AWAITING VERIFICATION. A
   badge is never flipped to ACTIVE from browser values: ACTIVE remains server
   truth reported by /api/v1/product-surface. Without a server-confirmed
   write, nothing is stored and the element stays CONFIGURATION_REQUIRED. */
(function(){
 var AMBER='#c58a16',KEY='ade_provider_config_v1';
 var CHANNELS=['EMAIL','AI','INTEGRATIONS','WHATSAPP','TELEGRAM','PARTNER'];
 function sget(s,k){try{return s.getItem(k)}catch(e){return null}}
 function sset(s,k,v){try{s.setItem(k,v)}catch(e){}}
 function readAll(){try{var s=sget(sessionStorage,KEY)||sget(localStorage,KEY);var o=s?JSON.parse(s):{};return o&&typeof o==='object'?o:{}}catch(e){return{}}}
 function saveAll(o){try{var s=JSON.stringify(o);sset(localStorage,KEY,s);sset(sessionStorage,KEY,s)}catch(e){}}
 function token(){return sget(sessionStorage,'ade_admin_token')||sget(localStorage,'ade_admin_token')||sget(sessionStorage,'ade_founder_token')||sget(localStorage,'ade_founder_token')||''}
 function norm(el){try{return String(el.textContent||'').replace(/\s+/g,' ').trim()}catch(e){return''}}
 function labelOf(el){try{var card=el.closest('.card,.wsCard,section');var head=card?String((card.querySelector('h3,h4,.panelTitle,.cardTitle')||{}).textContent||'').replace(/\s+/g,' ').trim():'';var own=norm(el);return head||own||'Provider configuration'}catch(e){return'Provider configuration'}}
 function keyOf(el,label){try{var scope=el.closest('[data-testid]');var sid=scope?scope.getAttribute('data-testid'):'';return(sid?sid+'::':'')+label.slice(0,90)}catch(e){return label.slice(0,90)}}
 function applyPending(el,rec){try{el.setAttribute('data-ade-cfg','configured_unverified');el.textContent='CONFIGURED — AWAITING VERIFICATION';el.style.background=AMBER;el.style.color='#111';el.style.borderColor=AMBER;el.style.fontWeight='800';el.style.letterSpacing='.05em';el.style.cursor='pointer';el.title='Server-confirmed configuration write '+(rec&&rec.at?new Date(rec.at).toLocaleString():'')+(rec&&rec.channelId?' · channel '+rec.channelId:'')+(rec&&rec.endpoint?' · '+rec.endpoint:'')+' — live verification remains server-side.';}catch(e){}}
 function openModal(key,label,el){
  try{
   var old=document.getElementById('ade-cfg-modal');if(old&&old.parentNode)old.parentNode.removeChild(old);
   var wrap=document.createElement('div');wrap.id='ade-cfg-modal';
   wrap.style.cssText='position:fixed;inset:0;z-index:90;background:rgba(3,10,20,.72);display:flex;align-items:center;justify-content:center;padding:18px';
   var box=document.createElement('div');
   box.style.cssText='width:100%;max-width:480px;background:#0c1a2b;border:1px solid #2a4663;border-radius:14px;padding:18px;color:#eef5ff;font-family:system-ui;box-shadow:0 18px 60px rgba(0,0,0,.5)';
   var head=document.createElement('div');head.textContent='Provider configuration · '+label;head.style.cssText='font-weight:800;font-size:14px;margin-bottom:4px';box.appendChild(head);
   var note=document.createElement('div');note.textContent='Configuring writes to the server through the canonical channel authority under your Admin/Founder session. Credentials are sent once, never stored in this browser, and never echoed back.';note.style.cssText='font-size:11px;color:#8fa4bd;margin-bottom:12px';box.appendChild(note);
   function sel(lbl,opts){var d=document.createElement('label');d.textContent=lbl;d.style.cssText='display:block;font-size:11px;color:#8fa4bd;margin:8px 0 4px';var s=document.createElement('select');s.style.cssText='width:100%;box-sizing:border-box;background:#12243a;border:1px solid #2a4663;border-radius:9px;color:#fff;padding:9px 10px;font-size:13px';for(var i=0;i<opts.length;i++){var o=document.createElement('option');o.value=opts[i];o.textContent=opts[i];s.appendChild(o)}box.appendChild(d);box.appendChild(s);return s}
   function field(lbl,type,ph){var d=document.createElement('label');d.textContent=lbl;d.style.cssText='display:block;font-size:11px;color:#8fa4bd;margin:8px 0 4px';var i=document.createElement('input');i.type=type;i.placeholder=ph;i.style.cssText='width:100%;box-sizing:border-box;background:#12243a;border:1px solid #2a4663;border-radius:9px;color:#fff;padding:9px 10px;font-size:13px';box.appendChild(d);box.appendChild(i);return i}
   var ch=sel('Channel',CHANNELS);
   var ep=field('Endpoint / Base URL','url','https://provider.example.com/api');
   var sk=field('API key / Token (sent once, never stored here)','password','••••••••');
   var ac=field('Account / Org ID (optional)','text','account-id');
   var msg=document.createElement('div');msg.style.cssText='font-size:11px;color:#facc15;margin-top:8px;min-height:14px';box.appendChild(msg);
   var row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:12px';
   var cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.style.cssText='background:#12243a;border:1px solid #2a4663;color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer';
   var ok=document.createElement('button');ok.type='button';ok.textContent='Submit to Server';ok.style.cssText='background:'+AMBER+';border:1px solid '+AMBER+';color:#111;font-weight:800;border-radius:9px;padding:9px 14px;cursor:pointer';
   row.appendChild(cancel);row.appendChild(ok);box.appendChild(row);wrap.appendChild(box);
   function close(){try{wrap.parentNode.removeChild(wrap)}catch(e){}}
   cancel.addEventListener('click',close);
   wrap.addEventListener('click',function(ev){if(ev.target===wrap)close()});
   ok.addEventListener('click',function(){
    var endpoint=String(ep.value||'').trim();var secret=String(sk.value||'');var account=String(ac.value||'').trim();var channel=String(ch.value||'INTEGRATIONS');
    if(endpoint&&!/^https?:\/\//i.test(endpoint)){msg.textContent='Endpoint must be a full http(s) URL.';return}
    if(!endpoint&&secret.length<4){msg.textContent='Provide at least an endpoint or a credential.';return}
    var t=token();
    if(!t){msg.textContent='Admin or Founder sign-in required — configuration is written by the server under an authenticated L2 session. Nothing was stored.';return}
    ok.disabled=true;msg.textContent='Submitting to the server…';
    fetch('/api/v1/connect/channels/configure',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+t},body:JSON.stringify({channelId:channel,baseUrl:endpoint||undefined,apiKey:secret||undefined,account:account||undefined})})
    .then(function(res){return res.text().then(function(txt){return{status:res.status,ok:res.ok,body:txt}})})
    .then(function(r){
     var j={};try{j=JSON.parse(r.body)||{}}catch(e){}
     if(!r.ok){
      ok.disabled=false;
      if([401,403].indexOf(r.status)>-1){msg.textContent='Server rejected this session for provider configuration (sign-in or L2 authority required). Nothing was stored.'}
      else{msg.textContent='Server error '+r.status+(j.error?' · '+j.error:'')+'. Nothing was stored.'}
      return;
     }
     var rec={state:'CONFIGURED_UNVERIFIED',label:label,channelId:channel,endpoint:endpoint||null,account:account||null,at:new Date().toISOString(),byServer:true,serverConfigured:j.configured===true};
     var all=readAll();all[key]=rec;saveAll(all);applyPending(el,rec);close();
     try{window.dispatchEvent(new CustomEvent('ade-config-activated',{detail:{key:key,label:label,channel:channel,state:rec.state,serverConfigured:rec.serverConfigured}}))}catch(e){}
    })
    .catch(function(){ok.disabled=false;msg.textContent='Server unreachable — configuration was NOT stored.'});
   });
   try{ep.focus()}catch(e){}
   document.body.appendChild(wrap);
  }catch(e){}
 }
 function markInteractive(el,key,label){try{if(el.getAttribute('data-ade-cfg-bound')==='1')return;el.setAttribute('data-ade-cfg-bound','1');el.style.cursor='pointer';el.style.borderBottom='1px dotted '+AMBER;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.title='Click to configure this capability (server-confirmed, L2 session required)';function open(ev){try{if(ev){ev.preventDefault();ev.stopPropagation()}}catch(e){}openModal(key,label,el)}el.addEventListener('click',open);el.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){open(ev)}})}catch(e){}}
 function scan(){try{var store=readAll();var nodes=document.querySelectorAll('.badge,span,div,td,p,strong,b');for(var i=0;i<nodes.length;i++){var el=nodes[i];var t=norm(el);if(t.indexOf('CONFIGURATION_REQUIRED')===-1)continue;if(el.children.length)continue;var label=labelOf(el);var key=keyOf(el,label);var rec=store[key];if(rec&&rec.state==='CONFIGURED_UNVERIFIED'&&rec.byServer===true){if(norm(el)!=='CONFIGURED — AWAITING VERIFICATION')applyPending(el,rec)}else{markInteractive(el,key,label)}}}catch(e){}}
 if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',scan)}else{scan()}
 try{new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true,characterData:true})}catch(e){}
 setInterval(scan,2000);
 window.ADE_INTERACTIVE_CONFIG={scan:scan,store:KEY,channels:CHANNELS.slice(),state:'SERVER_CONFIRMED_ONLY'};
})();
</script>
<script id="ade-invitation-banner">
/* ADE INVITATION MESH — server-validated role onboarding. The code is
   validated by the trusted backend (POST /api/v1/onboarding/claim) with
   expiry and tenant enforcement. A valid result is a CLAIM RECORD only:
   non-authoritative, stored for UX continuity, and never an access grant.
   Roles are provisioned exclusively by ADE operators through the workforce
   invitation flow; this banner can never assign one. Offline or rejected —
   nothing is stored, nothing is claimed. */
(function(){
 var CODES=['INV-FOUNDER','INV-ADMIN-L3','INV-ADMIN-L2','INV-ADMIN-L1','INV-ADMIN-L0','INV-PILOT','INV-PARTNER'];
 var KEY='ade_invitation_state',MIN='ade_invite_banner_min';
 function sget(s,k){try{return s.getItem(k)}catch(e){return null}}
 function sset(s,k,v){try{s.setItem(k,v)}catch(e){}}
 function sdel(s,k){try{s.removeItem(k)}catch(e){}}
 function stored(){try{var s=sget(localStorage,KEY)||sget(sessionStorage,KEY);var o=s?JSON.parse(s):null;return o&&typeof o==='object'?o:null}catch(e){return null}}
 function persist(o){try{var s=JSON.stringify(o);sset(localStorage,KEY,s);sset(sessionStorage,KEY,s)}catch(e){}}
 function tenant(){try{return String((document.body&&document.body.getAttribute('data-ade-tenant'))||sget(localStorage,'ade_tenant')||'').trim()||null}catch(e){return null}}
 function render(){
  try{
   if(document.getElementById('ade-invitation-banner'))return;
   var wrap=document.createElement('div');wrap.id='ade-invitation-banner';
   wrap.style.cssText='position:fixed;right:16px;bottom:16px;z-index:70;font-family:system-ui';
   var shell=document.createElement('div');
   shell.style.cssText='max-width:340px;background:#0c1a2b;border:1px solid #2a4663;border-radius:14px;padding:12px 14px;color:#eef5ff;box-shadow:0 14px 40px rgba(0,0,0,.45)';
   var title=document.createElement('div');title.textContent='INVITATION MESH · SERVER-VALIDATED ONBOARDING';title.style.cssText='font-size:11px;font-weight:800;letter-spacing:.08em;color:#7dd3fc';shell.appendChild(title);
   var status=document.createElement('div');status.id='ade-invite-status';status.style.cssText='font-size:11px;color:#8fa4bd;margin:6px 0 8px';shell.appendChild(status);
   var row=document.createElement('div');row.style.cssText='display:flex;gap:6px';
   var input=document.createElement('input');input.id='ade-invite-code';input.type='text';input.placeholder='INV-XXXX';input.setAttribute('aria-label','Invitation code');input.style.cssText='flex:1;min-width:0;background:#12243a;border:1px solid #2a4663;border-radius:9px;color:#fff;padding:8px 10px;font-size:12px;text-transform:uppercase';row.appendChild(input);
   var apply=document.createElement('button');apply.id='ade-invite-apply';apply.type='button';apply.textContent='Validate';apply.style.cssText='background:#059669;border:1px solid #059669;color:#fff;font-weight:800;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:12px';row.appendChild(apply);
   shell.appendChild(row);
   var row2=document.createElement('div');row2.style.cssText='display:flex;gap:6px;margin-top:6px';
   var clear=document.createElement('button');clear.id='ade-invite-clear';clear.type='button';clear.textContent='Clear record';clear.style.cssText='background:#12243a;border:1px solid #2a4663;color:#8fa4bd;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:11px';row2.appendChild(clear);
   var min2=document.createElement('button');min2.id='ade-invite-min';min2.type='button';min2.textContent='Minimize';min2.style.cssText='background:#12243a;border:1px solid #2a4663;color:#8fa4bd;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:11px';row2.appendChild(min2);
   shell.appendChild(row2);
   wrap.appendChild(shell);
   var mini=document.createElement('button');mini.id='ade-invite-restore';mini.type='button';mini.textContent='INV';mini.style.cssText='display:none;background:#059669;border:1px solid #059669;color:#fff;font-weight:800;border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:12px';wrap.appendChild(mini);
   document.body.appendChild(wrap);
   function setStatus(text){try{status.textContent=text}catch(e){}}
   function restoreView(){
    var st=stored();var minimized=sget(sessionStorage,MIN)==='1';
    shell.style.display=minimized?'none':'';mini.style.display=minimized?'':'none';
    if(st&&st.claim&&st.claim.role){input.value=st.code||'';setStatus('CLAIM RECORD (NON-AUTHORITATIVE) · '+st.claim.role+' · '+st.claim.tier+' · server-validated'+(st.validatedAt?' '+new Date(st.validatedAt).toLocaleString():'')+' — access is provisioned only by ADE operators.')}else{setStatus('Enter an invitation code — validated by the server ('+CODES.join(', ')+').')}
   }
   apply.addEventListener('click',function(){
    var v=String(input.value||'').trim().toUpperCase();
    if(!v){setStatus('Enter an invitation code to continue.');return}
    apply.disabled=true;setStatus('Validating with the server…');
    fetch('/api/v1/onboarding/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:v,tenant:tenant()})})
    .then(function(res){return res.text().then(function(txt){return{status:res.status,ok:res.ok,body:txt}})})
    .then(function(r){
     apply.disabled=false;
     var j={};try{j=JSON.parse(r.body)||{}}catch(e){}
     if(!r.ok){
      var m={400:'Enter an invitation code to continue.',404:'Not a recognised invitation code — nothing was stored.',410:'This invitation code has expired — nothing was stored. Ask your ADE contact for a renewed code.',403:'This code is not valid for this workspace/tenant — nothing was stored.'}[r.status]||('Server error '+r.status+' — nothing was stored.');
      setStatus(m);return;
     }
     if(!j||j.validated!==true||!j.claim){setStatus('Server returned no validated claim — nothing was stored.');return}
     var st={code:v,claim:j.claim,validatedAt:new Date().toISOString(),authoritative:false,source:'server-validated'};
     persist(st);restoreView();
     try{window.dispatchEvent(new CustomEvent('ade-invitation-assigned',{detail:st}))}catch(e){}
    })
    .catch(function(){apply.disabled=false;setStatus('Server unreachable — the claim could not be validated and nothing was stored.')});
   });
   clear.addEventListener('click',function(){sdel(localStorage,KEY);sdel(sessionStorage,KEY);input.value='';setStatus('Record cleared — awaiting invitation code.');try{window.dispatchEvent(new CustomEvent('ade-invitation-cleared',{}))}catch(e){}});
   min2.addEventListener('click',function(){sset(sessionStorage,MIN,'1');restoreView()});
   mini.addEventListener('click',function(){sdel(sessionStorage,MIN);restoreView()});
   input.addEventListener('keydown',function(ev){if(ev.key==='Enter'){try{ev.preventDefault()}catch(e){}apply.click()}});
   restoreView();
   try{if(sget(sessionStorage,MIN)==null){sset(sessionStorage,MIN,'0')}}catch(e){}
  }catch(e){}
 }
 function boot(){if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',render)}else{render()}}
 boot();
 window.ADE_INVITATION_MESH={codes:CODES.slice(),read:stored,validate:function(code){return fetch('/api/v1/onboarding/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:String(code||'').trim().toUpperCase(),tenant:tenant()})}).then(function(r){return r.json()})},authoritative:false};
})();
</script>
