<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2eb">
<meta name="description" content="ADE APEX — Autonomous Event-Driven Operations Platform. Community Edition public surface: products, PROCARTA, AWBULI, Product Theater, community and feedback.">
<title>ADE APEX — Autonomous Event-Driven Operations Platform</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{
 --bg:#f5f2eb;--bg2:#ece8df;--surface:rgba(255,255,255,.9);--surface2:rgba(255,255,255,.62);
 --ocean:#061a40;--royal:#0a3d91;--blue:#1b5fdc;--cyan:#0bb6d2;--coral:#ef3b52;
 --ink:#0b1c36;--muted:#5a6a85;--faint:#7c89a1;
 --line:rgba(6,26,64,.13);--lineSoft:rgba(6,26,64,.08);
 --good:#12906a;--warn:#c58a16;--bad:#d93a4e;
 --shadow:0 22px 60px rgba(6,26,64,.12);--shadowSm:0 10px 30px rgba(6,26,64,.08);
 --radius:18px;--radiusSm:12px;
 --focusRing:0 0 0 3px rgba(11,182,210,.18);
 --gold1:#b8860b;--gold2:#daa520;--gold3:#ffd700;
 --page-gutter:32px;--content-max:1240px;
 --header-height:92px;--nav-height:48px;
 --section-gap:26px;--card-gap:16px;--panel-padding:20px;
 --touch:44px;
}
*{box-sizing:border-box;min-width:0}html,body,#root{margin:0;width:100%;max-width:100%}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 18% -8%,rgba(11,182,210,.10),transparent 60%),radial-gradient(1100px 700px at 92% 6%,rgba(27,95,220,.12),transparent 55%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:clip}
.app{min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;height:auto}
pre{white-space:pre-wrap;word-break:break-word}
button{font-family:inherit}
a{color:var(--royal)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:650;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--royal);background:#fff;box-shadow:var(--shadowSm)}
.btn.primary{background:linear-gradient(135deg,var(--royal),var(--blue));border-color:rgba(6,26,64,.3);color:#fff;box-shadow:0 8px 24px rgba(10,61,145,.28)}
.btn.primary:hover{background:linear-gradient(135deg,#0c4bb0,#2467e8);color:#fff}
.btn.azure{background:linear-gradient(135deg,rgba(11,182,210,.14),rgba(27,95,220,.1));border-color:rgba(11,182,210,.4);color:var(--royal)}
.btn.coral{background:linear-gradient(135deg,rgba(239,59,82,.12),rgba(239,59,82,.05));border-color:rgba(239,59,82,.35);color:#b9273a}
.btn.sm{min-height:44px;min-width:44px;padding:7px 13px;font-size:12.5px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--royal);font-weight:700}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn:focus-visible{outline:none;box-shadow:var(--focusRing);border-color:var(--cyan)}
.iconBtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch);min-width:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;transition:.18s}
.iconBtn:hover{border-color:var(--cyan);color:var(--royal)}
.iconBtn:focus-visible{outline:none;box-shadow:var(--focusRing);border-color:var(--cyan)}
.card{transition:transform .18s, box-shadow .18s, border-color .18s}
.card:hover{border-color:rgba(6,26,64,.18)}
.btn:active{transform:translateY(1px)}
.cap:focus-visible{outline:none;box-shadow:var(--focusRing)}
.search:focus-visible{outline:none;box-shadow:var(--focusRing)}
/* ── Header ────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;width:100%;background:rgba(245,242,235,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--lineSoft);transition:box-shadow .2s;box-shadow:0 10px 34px rgba(6,26,64,.06)}
.top.scrolled{box-shadow:0 6px 26px rgba(6,26,64,.10)}
.topInner{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 0 8px;flex-wrap:nowrap;min-width:0}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.brand img{width:clamp(50px,6.4vw,80px);height:clamp(50px,6.4vw,80px);object-fit:contain;transition:.22s}
.top.scrolled .brand img{width:clamp(46px,5vw,60px);height:clamp(46px,5vw,60px)}
.brandName strong{display:block;font-size:clamp(13px,1.4vw,15.5px);letter-spacing:.11em;color:var(--ocean);line-height:1.15;white-space:nowrap}
.brandName span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.12em;margin-top:3px;text-transform:uppercase;white-space:nowrap}
.brand-name{display:block;font-size:8.5px;color:var(--faint);letter-spacing:.1em;margin-top:2px;text-transform:uppercase;white-space:nowrap}
.brandName strong{display:block}
.topIdentity{display:flex;flex-direction:column;gap:3px;flex:0 1 auto;min-width:0;padding:0 4px;border-left:1px solid var(--lineSoft);padding-left:16px}
.topIdentity .idMain{font-size:clamp(8.5px,1vw,10.5px);font-weight:900;letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(135deg,#b8860b 0%,#daa520 18%,#ffd700 36%,#daa520 54%,#b8860b 72%,#8b6914 88%,#b8860b 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topIdentity .idSub{font-size:clamp(7.5px,.86vw,9px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topMotto{display:flex;justify-content:center;align-items:center;padding:7px 0;width:100%;border-top:1px solid var(--lineSoft);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(249,247,242,.9));min-height:var(--nav-height)}
.topMottoInner{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0}
.topMottoLine{font-size:clamp(10px,1.1vw,13px);font-weight:750;letter-spacing:.14em;color:var(--ocean);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.topMottoLine em{color:var(--coral);font-style:normal}
.topNav{display:flex;align-items:center;gap:2px;flex:1 1 auto;justify-content:flex-end;flex-wrap:nowrap;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;min-width:0}
.topNav::-webkit-scrollbar{display:none}
.topNav button{all:unset;cursor:pointer;min-height:44px;padding:7px 10px;border-radius:11px;color:#3c4d68;font-size:12.5px;font-weight:600;border:1px solid transparent;transition:.16s;white-space:nowrap;flex:none}
.topNav button:hover{color:var(--ocean);background:rgba(255,255,255,.7)}
.topNav button.active{color:var(--royal);background:#fff;border-color:var(--lineSoft);box-shadow:var(--shadowSm)}
.topNav button.ops{color:var(--coral)}
.topNav button.ops.active{color:#fff;background:linear-gradient(135deg,var(--coral),#f07a8c);border-color:transparent}
.topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.headerContact{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;padding:2px 8px;border-left:1px solid var(--lineSoft);min-width:0}
.headerContact a,.headerContact span{font-size:11px;color:var(--muted);text-decoration:none;white-space:nowrap;line-height:1.4}
.headerContact a:hover{color:var(--royal)}
.headerContact .contact-label{color:var(--faint);font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
.headerContact .contact-row{display:flex;align-items:center;gap:6px;min-height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:10px;font-weight:750;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn);flex:none}
.pill.live .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
.pill.off .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:3px 9px;border-radius:99px;font-size:9.5px;font-weight:800;letter-spacing:.08em;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.community{color:var(--royal);border-color:rgba(27,95,220,.35);background:rgba(27,95,220,.07)}
.badge.pro{color:var(--warn);border-color:rgba(197,138,22,.4);background:rgba(197,138,22,.07)}
.badge.enterprise{color:var(--coral);border-color:rgba(239,59,82,.4);background:rgba(239,59,82,.07)}
.badge.good{color:var(--good);border-color:rgba(18,144,106,.4);background:rgba(18,144,106,.07)}
.badge.bad{color:var(--bad);border-color:rgba(217,58,78,.4);background:rgba(217,58,78,.07)}
.badge.muted{color:var(--muted);border-color:var(--line)}
.hamburger{display:none}
.topRight .btn span.hideL{display:none}
/* mobile menu */
.mobileMenu{display:none;border-top:1px solid var(--lineSoft);background:rgba(255,255,255,.98);padding:10px 16px 18px;gap:4px}
.mobileMenu.open{display:grid}
.mobileMenu button{all:unset;cursor:pointer;min-height:48px;padding:12px 12px;border-radius:12px;color:#3c4d68;font-size:15px;font-weight:650;border:1px solid transparent}
.mobileMenu button:hover,.mobileMenu button.active{color:var(--royal);background:rgba(27,95,220,.07);border-color:var(--lineSoft)}
.mobileMenu button.ops{color:var(--coral)}
.mobileMenu .sub{font-size:11px;color:var(--faint);padding:12px 12px 4px;letter-spacing:.16em;font-weight:800}
.mobileMenu .identity-line{font-size:10.5px;color:var(--muted);padding:10px 12px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;background:linear-gradient(135deg,#b8860b,#daa520 40%,#ffd700 55%,#b8860b);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.4}
.mobileMenu .contact-line{padding:10px 12px 2px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.mobileMenu .contact-line a{color:var(--royal)}
.mobileMenu a{color:var(--royal);text-decoration:none;min-height:48px;padding:13px 12px;font-size:14.5px;border-radius:12px;font-weight:600}
/* ── Shared ────────────────────────────────── */
.shell{width:min(calc(100% - 2*var(--page-gutter)),var(--content-max));margin:0 auto;padding:var(--section-gap) 0 60px;flex:1}
.card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,255,255,.72));box-shadow:var(--shadowSm);backdrop-filter:blur(10px);min-width:0;max-width:100%}
.card.pad{padding:var(--panel-padding)}
.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--lineSoft);flex-wrap:wrap}
.panelTitle h3{margin:0;font-size:12.5px;letter-spacing:.15em;color:var(--ocean)}
.panelTitle span{font-size:10px;color:var(--muted);letter-spacing:.12em}
.muted{color:var(--muted)}
.eyebrow{color:var(--royal);font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
.cardBody{padding:18px}
.stack{display:grid;gap:var(--section-gap)}
.tableWrap{overflow-x:auto;max-width:100%;padding:0 18px 14px;margin-bottom:2px}
.tableWrap table{min-width:640px;width:100%;border-collapse:collapse;font-size:12.5px}
.tableWrap th{text-align:left;padding:9px 10px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.tableWrap td{padding:10px;border-bottom:1px solid var(--lineSoft);color:#3c4d68;white-space:nowrap}
/* community + feedback: two distinct cards, side by side (1 col <=720px) */
.interactGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--card-gap);align-items:stretch}
.interactGrid .card{min-width:0;max-width:100%}
/* auth + credential feedback */
.authStatus{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;display:flex;align-items:flex-start;gap:8px}
.authStatus.ok{background:rgba(18,144,106,.1);border:1px solid rgba(18,144,106,.4);color:var(--good)}
.authStatus.err{background:rgba(217,58,78,.08);border:1px solid rgba(217,58,78,.38);color:var(--bad)}
.authLoading{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:10px}
.spinner{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--royal);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.toast.ok{background:linear-gradient(135deg,#0c513f,#12906a);color:#fff}
.toast.err{background:linear-gradient(135deg,#7c1830,#d93a4e);color:#fff}
/* credential form groups */
.formGroup{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--lineSoft)}
.formGroup:last-child{padding-bottom:0;border-bottom:none}
.passWrap{position:relative;display:flex;align-items:center}
.passWrap input{width:100%;padding-right:64px}
.passWrap .showToggle{position:absolute;right:6px;background:none;border:none;color:var(--royal);font-size:11.5px;font-weight:700;cursor:pointer;min-height:36px;padding:0 10px;letter-spacing:.04em}
.passWrap .showToggle:hover{text-decoration:underline}
.fieldErr{color:var(--bad);font-size:11.5px;margin-top:2px;font-weight:600}
.formHint{color:var(--muted);font-size:11px;line-height:1.5;margin:0}
.formOk{color:var(--good);font-size:11.5px;margin-top:2px;font-weight:600;line-height:1.5}
/* ── Home hero ──────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.55fr);gap:20px}
.heroMain{padding:clamp(22px,4vw,44px);position:relative;overflow:hidden}
.heroMain h1{font-size:clamp(1.95rem,4.6vw,3.6rem);line-height:1.06;margin:14px 0 14px;letter-spacing:-.025em;color:var(--ocean);max-width:760px}
.heroMain p{color:var(--muted);font-size:clamp(0.95rem,1.2vw,1.06rem);line-height:1.65;max-width:660px;margin:0 0 22px}
.heroActions{display:flex;gap:12px;flex-wrap:wrap}
.heroStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--lineSoft)}
.suggestion-carousel{position:relative;height:22px;overflow:hidden;margin-top:16px}
.suggestion-text{position:absolute;width:100%;animation:suggestionFade 12s infinite;opacity:0;font-size:12px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.suggestion-text:nth-child(1){animation-delay:0s}.suggestion-text:nth-child(2){animation-delay:3s}.suggestion-text:nth-child(3){animation-delay:6s}.suggestion-text:nth-child(4){animation-delay:9s}
@keyframes suggestionFade{0%,2%{opacity:0;transform:translateY(8px)}5%,25%{opacity:1;transform:translateY(0)}28%,100%{opacity:0;transform:translateY(-8px)}}
.heroStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px 12px;border:1px solid var(--lineSoft);border-radius:14px;background:rgba(255,255,255,.7)}
.stat b{display:block;font-size:clamp(18px,2.6vw,24px);letter-spacing:.02em;color:var(--ocean)}
.stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;margin-top:4px;text-transform:uppercase}
.orb{align-self:stretch;display:grid;place-items:center;min-height:280px;background:radial-gradient(circle at center,rgba(11,182,210,.16),transparent 48%),linear-gradient(150deg,rgba(255,255,255,.6),rgba(236,232,223,.4))}
.orbCore{width:150px;height:150px;border-radius:42% 58% 55% 45%;transform:rotate(17deg);background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(11,182,210,.18) 35%,rgba(27,95,220,.24) 60%,rgba(255,255,255,.4));border:1px solid rgba(6,26,64,.18);box-shadow:inset -14px -16px 30px rgba(6,26,64,.08),inset 10px 8px 22px rgba(255,255,255,.5),0 0 70px rgba(27,95,220,.22);animation:float 6s ease-in-out infinite;display:grid;place-items:center;color:var(--royal);font-weight:900;letter-spacing:.1em}
@keyframes float{50%{transform:rotate(21deg) translateY(-10px)}}
/* value pillars */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.pillar{padding:20px 18px}
.pillar .n{color:var(--royal);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.pillar h4{margin:10px 0 6px;color:var(--ocean);font-size:16px}
.pillar p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
/* products */
.featureGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.feature{padding:22px;display:flex;flex-direction:column;gap:10px}
.feature .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--royal),var(--blue));font-size:14px;letter-spacing:.04em}
.feature .mark.m2{background:linear-gradient(135deg,var(--coral),#f07a8c)}
.feature .mark.m3{background:linear-gradient(135deg,var(--cyan),#37c9df)}
.feature .n{font-size:17px;font-weight:800;color:var(--ocean)}
.feature .d{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.feature .accent{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.productGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.product{padding:16px;border:1px solid var(--lineSoft);border-radius:14px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:8px}
.product .n{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ocean)}
.product .d{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.product .tags{display:flex;flex-wrap:wrap;gap:6px}
/* theater / media */
.truthRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.truthChip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:11px;font-weight:750;color:var(--muted);background:rgba(255,255,255,.7)}
.truthChip.live{color:var(--good);border-color:rgba(18,144,106,.4);background:rgba(18,144,106,.06)}
.truthChip.sim{color:var(--warn);border-color:rgba(197,138,22,.4);background:rgba(197,138,22,.06)}
.truthChip.promo{color:var(--royal);border-color:rgba(27,95,220,.35);background:rgba(27,95,220,.06)}
.truthChip.future{color:var(--cyan);border-color:rgba(11,182,210,.4);background:rgba(11,182,210,.06)}
.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.mediaCard{border:1px solid var(--lineSoft);border-radius:14px;background:rgba(255,255,255,.7);overflow:hidden;display:flex;flex-direction:column}
.mediaThumb{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,rgba(27,95,220,.14),rgba(11,182,210,.1));color:var(--royal);font-size:26px;border-bottom:1px solid var(--lineSoft)}
.mediaCard .meta{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mediaCard .n{font-size:12.5px;font-weight:700;line-height:1.4;color:var(--ink)}
.mediaCard .d{font-size:11px;color:var(--muted);line-height:1.4}
/* metrics (ops) */
.metricRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.metric{padding:16px 18px}
.metric .label{color:var(--muted);font-size:10px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
.metric .value{font-size:clamp(20px,3vw,26px);font-weight:800;margin-top:8px;letter-spacing:.01em;color:var(--ocean)}
.metric .trend{color:var(--muted);font-size:11px;margin-top:6px}
.metric .value.small{font-size:16px}
.metric .value.good{color:var(--good)}.metric .value.warn{color:var(--warn)}.metric .value.coral{color:var(--coral)}
/* two-column surface (ops) */
.sectionGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.stream{max-height:330px;overflow:auto;padding:6px 16px 14px}
.event{padding:11px 0;border-bottom:1px solid var(--lineSoft)}
.event time{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em}

    gap: 6px 9px;
  }

  .ade-home-responsive .ade-header-nav a,
  .ade-home-responsive .ade-header-nav button {
    font-size: 14px;
  }

  .ade-home-responsive .ade-rotating-text {
    font-size: 19px;
    line-height: 1.45;
  }

  .ade-home-responsive .ade-architecture-stack {
    gap: 8px !important;
  }
}

@media (max-width: 480px) {
  .ade-home-responsive .ade-header-nav {
    width: 100%;
    gap: 5px 7px;
  }

  .ade-home-responsive .ade-header-nav a,
  .ade-home-responsive .ade-header-nav button {
    font-size: 13px;
  }

  .ade-home-responsive .ade-identity {
    padding-left: 12px;
    padding-right: 12px;
  }

  .ade-home-responsive .ade-rotating-text {
    width: calc(100% - 24px);
    font-size: 18px;
    line-height: 1.4;
  }

  .ade-home-responsive .ade-pilot-cta {
    width: calc(100% - 24px);
    font-size: 16px;
  }
}
/* ADE ROLE WORKSPACE SURFACE (product-surface closure, UI only) */
.wsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.wsMod{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--lineSoft);background:rgba(255,255,255,.75);min-height:44px;text-align:left}
.wsMod:hover{border-color:var(--royal);background:#fff;box-shadow:var(--shadowSm)}
.wsMod.active{border-color:var(--royal);background:#fff;box-shadow:var(--shadowSm)}
.wsMod .mark{width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--royal),var(--blue))}
.wsMod .t{font-size:13px;font-weight:750;color:var(--ocean)}
.wsMod .d{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.wsHead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tableScroll{overflow-x:auto;max-width:100%;border:1px solid var(--lineSoft);border-radius:12px;background:rgba(255,255,255,.7)}
.tableScroll table{width:100%;border-collapse:collapse;min-width:560px}
.tableScroll th,.tableScroll td{padding:9px 10px;border-bottom:1px solid var(--lineSoft);text-align:left;font-size:12.5px;vertical-align:top}
.tableScroll th{font-size:10.5px;letter-spacing:.1em;color:var(--ocean);background:rgba(6,26,64,.04)}
.rowBtns{display:flex;gap:6px;flex-wrap:wrap}
.mobileMenu.open{max-height:min(72vh,640px);overflow-y:auto}
@media(max-width:520px){.wsGrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}.wsMod{padding:10px}.tableScroll th,.tableScroll td{padding:7px 8px;font-size:12px}}
@media(max-width:430px){.topInner{gap:6px}.wsGrid{grid-template-columns:1fr 1fr}.mobileMenu button,.mobileMenu a{font-size:15px}}
